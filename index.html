<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPIc 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#EEF0F4; --card:#FFFFFF; --ink:#14233C; --soft:#5B6B84; --faint:#8593A8;
  --line:#DCE1E9; --audio:#0E7C86; --audio-bg:#DEF0F1; --rec:#B8403C; --rec-bg:#F8E7E6;
  --keep:#1D6647; --keep-bg:#E2F0E9; --adapt:#1C558F; --adapt-bg:#E4EDF8;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0F141D; --card:#19202B; --ink:#E7EBF2; --soft:#9AA8BD; --faint:#6F7E94;
    --line:#2A3342; --audio:#63C7CE; --audio-bg:#123338; --rec:#E0817D; --rec-bg:#38211F;
    --keep:#7FCBA5; --keep-bg:#152A21; --adapt:#8FB9E8; --adapt-bg:#15243A;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px; line-height:1.6;
}
.wrap{max-width:720px; margin:0 auto; padding:0 16px 64px}

header{padding:28px 0 18px}
h1{font-size:23px; font-weight:600; margin:0; letter-spacing:-.01em}
.sub{color:var(--soft); font-size:13.5px; margin:5px 0 0}

.bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:18px}
.tabs{display:flex; gap:6px; flex:1 1 auto; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--soft);
  border-radius:999px; padding:7px 15px; font-size:14px; font-family:inherit; cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:500}
select{
  border:1px solid var(--line); background:var(--card); color:var(--soft);
  border-radius:999px; padding:7px 12px; font-size:13px; font-family:inherit; max-width:190px;
}

.group{margin-top:30px}
.group-label{
  display:flex; align-items:center; gap:12px;
  font-size:12.5px; color:var(--faint); margin-bottom:10px; letter-spacing:.01em;
}
.group-label::after{content:""; flex:1; height:1px; background:var(--line)}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:8px; overflow:hidden;
}
.card.open{border-color:var(--ink)}
.row{display:flex; align-items:center; gap:12px; padding:12px 14px}
.num{font-size:12.5px; color:var(--faint); min-width:24px; font-variant-numeric:tabular-nums}
.topic{flex:1; font-size:15px; font-weight:500; min-width:0}

.speak{
  flex:0 0 auto; width:42px; height:42px; border-radius:50%; cursor:pointer;
  border:none; background:var(--audio-bg); color:var(--audio);
  display:grid; place-items:center; font-family:inherit;
}
.speak svg{width:20px; height:20px; fill:currentColor}
.speak.on{background:var(--audio); color:var(--card)}
.speak.on::after{
  content:""; position:absolute; width:42px; height:42px; border-radius:50%;
  border:2px solid var(--audio); animation:ring 1.3s ease-out infinite;
}
.speak-wrap{position:relative; display:grid; place-items:center; flex:0 0 auto}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.55);opacity:0}}
@media (prefers-reduced-motion:reduce){.speak.on::after{animation:none; opacity:.4}}

.toggle{
  flex:0 0 auto; width:32px; height:32px; border:none; background:none; cursor:pointer;
  color:var(--faint); display:grid; place-items:center;
}
.toggle svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; transition:transform .18s ease}
.card.open .toggle svg{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.toggle svg{transition:none}}

.panel{display:none; padding:2px 14px 16px; border-top:1px solid var(--line); margin:0 0 0}
.card.open .panel{display:block}
.en{font-family:"Newsreader",Georgia,serif; font-size:17px; line-height:1.6; margin:14px 0 0}
.tagline{display:flex; align-items:center; gap:8px; margin:20px 0 6px}
.tagline span:first-child{font-size:12.5px; color:var(--faint)}
.badge{font-size:11.5px; padding:2px 9px; border-radius:999px; font-weight:500}
.badge.keep{background:var(--keep-bg); color:var(--keep)}
.badge.adapt{background:var(--adapt-bg); color:var(--adapt)}
.ans{font-family:"Newsreader",Georgia,serif; font-size:16.5px; line-height:1.8; color:var(--soft); margin:0}
.qlabel{font-size:12.5px; color:var(--faint); margin:0}

.tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:18px}
.btn{
  border:1px solid var(--line); background:none; color:var(--soft); border-radius:999px;
  padding:7px 14px; font-size:13.5px; font-family:inherit; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{border-color:var(--soft)}
.btn.rec{color:var(--rec); border-color:var(--rec)}
.btn.rec.active{background:var(--rec-bg)}
.dot{width:8px; height:8px; border-radius:50%; background:currentColor}
.btn.rec.active .dot{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.btn.rec.active .dot{animation:none}}
audio{width:100%; margin-top:12px; height:38px}
.note{font-size:12.5px; color:var(--faint); margin:10px 0 0}

button:focus-visible,select:focus-visible{outline:2px solid var(--audio); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>OPIc 연습</h1>
  <p class="sub">질문을 듣고 2분 동안 답한 뒤, 펼쳐서 모범답안과 비교하세요.</p>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <select id="voice" aria-label="읽어주는 목소리"></select>
  </div>
</header>

<main id="list"></main>

<p class="note" id="foot"></p>

</div>

<script>
const DATA = [{"no":1,"title":"모의고사 1회","groups":[{"label":"시작","items":[{"n":1,"src":"응용","q":"Let's start the interview now. Tell me a little bit about yourself.","a":""}]},{"label":"Set 1","items":[{"n":2,"src":"그대로","q":"You indicated in the survey that you like to go to parks. Tell me about one of the parks you often visit. Where is it located, and what does it look like? Please describe it in as much detail as possible.","a":"I'd like to talk about a park called Central Park. There are many reasons why I like it the most. First of all, it is not far from where I live. It takes about only 10 minutes on foot, so I can save time. Also it has beautiful scenery and especially it's well-known for a magnificent lake at the center. So when I relax there, I can enjoy the beauty of nature and relieve stress. In addition, I can enjoy a wide range of events often happening there, from music concerts to local community events. They are fun, informative, and free. Plus, there is a traditional market nearby, which is famous for fresh local food. It's so fresh and delicious and served at a reasonable price. Thus, when I'm there, I always have a lot of fun and even have a chance to meet new people who are usually nice and friendly. I think that's a great way to make friends. Even though it is sometimes a bit crowded, I believe it is still the best place to give so much happiness and comfort."},{"n":3,"src":"그대로","q":"What do you usually do when you go to the park? Who do you usually go with, and how often do you go? Tell me about a typical visit from beginning to end.","a":"When I have free time, I try to do something fun to escape from everyday routine. Usually, I go to a park nearby. We have many good parks in the city, so they can be used for a nice walk. Typically, there is a big lake at the center and around it, there are good walking paths, so I often walk on one of the tracks and relax on the bench around the park. Also, I often watch some movies there on my smartphone after the walk. They are so energetic and entertaining that I can relieve stress and refresh myself. I believe these are great ways to enjoy my free time and cheer myself up at a park."},{"n":4,"src":"그대로","q":"Tell me about a memorable experience you had at a park. When was it, who were you with, and what happened? Why was it so memorable?","a":"A couple of weeks ago, I went to a park near my house for a walk with my friend. Usually the time of the day we went was quiet, so we wanted to spend quality time catching up with each other. However, at that time, I found a lot of people buzzing around or gathering together while looking at something. As I came close to them, I could see a famous actor filming there. Even though he was wearing a pair of sweatpants and a sweatshirt, he looked so fabulous. It was my first time to see a celebrity in person. So, I kept watching him until his break time. Luckily, I could take a picture with him and get his autograph as well. Since then, I've become his fan. Every time I watch him on TV, that brings back the good memory and makes me smile."}]},{"label":"Set 2","items":[{"n":5,"src":"응용","q":"You indicated in the survey that you travel overseas. Tell me about a country or city you have visited. What was it like there? Describe the places and the people you saw.","a":"I'd like to talk about Bali. There are many reasons why I like it the most. First of all, it is not far from my country. It takes about only a few hours by plane, so I can save time. Also it has beautiful scenery and especially it's well-known for a magnificent beach. So when I relax there, I can enjoy the beauty of nature and relieve stress. In addition, I can enjoy a wide range of events often happening there, from music concerts to local community events. They are fun, informative, and free. Plus, there is a traditional market, which is famous for fresh local food. It's so fresh and delicious and served at a reasonable price. Thus, when I'm there, I always have a lot of fun and even have a chance to meet new people who are usually nice and friendly. I think that's a great way to make friends. Even though it is sometimes a bit crowded, I believe it is still the best place to enjoy my vacation."},{"n":6,"src":"응용","q":"What do you usually do to prepare for a trip abroad? Tell me about everything you do before you leave, step by step.","a":"Let me tell you about what I do before I leave for a trip abroad, step by step. First, I choose where to go. I usually talk with my family and decide together. We like places which are famous for beautiful beaches and fresh local food. Next, I book my flight and hotel online. Because I live on a tight budget, I compare prices on a few websites and check if any promotions are going on. Booking early is important because it's much more affordable. After that, I make a simple plan. I search on the internet to find out famous spots, local restaurants, and events happening there. I don't plan every minute, but I write down the places I really want to visit. Then, I get some things ready. I exchange some money and buy a SIM card so that I can use the internet there. I also make sure my passport hasn't expired. Finally, I pack my bag the night before. I take comfortable clothes, my phone charger, and some medicine, just in case. Actually, preparing for the trip is half the fun for me."},{"n":7,"src":"그대로","q":"Tell me about an unexpected or unusual thing that happened while you were traveling abroad. What was the situation, and how did you deal with it?","a":"A couple of weeks ago, while traveling, I went to a park near my hotel for a walk with my friend. Usually the time of the day we went was quiet, so we wanted to spend quality time catching up with each other. However, at that time, I found a lot of people buzzing around or gathering together while looking at something. As I came close to them, I could see a famous actor filming there. Even though he was wearing a pair of sweatpants and a sweatshirt, he looked so fabulous. It was my first time to see a celebrity in person. So, I kept watching him until his break time. Luckily, I could take a picture with him and get his autograph as well. Since then, I've become his fan. Every time I watch him on TV, that brings back the good memory and makes me smile."}]},{"label":"Set 3","items":[{"n":8,"src":"그대로","q":"I'd like to know about recycling in your country. What kinds of items do people recycle, and how is it done?","a":"In Korea, almost everyone participates in recycling because we get fined when we don't do it. To recycle, people put items made of paper, metal, glass, and plastic in different bins at home and even at work. So, usually we keep several bins for different recyclable items. Once the recyclables are sorted out, we take them to the pickup area once or twice a week. In my district, the pickup is scheduled twice a week. Then the government sends out trucks to collect them. To be honest, I don't like doing it because it is tiresome, but I know it's necessary to save natural resources."},{"n":9,"src":"그대로","q":"Recycling has changed over the years. How was recycling different when you were younger compared to how it is now?","a":"Oh my gosh! This is a difficult question. Well... there have been changes in recycling in my country. In the past, there were no recycling policies, so people didn't sort out recyclable materials. They just put everything in a plastic garbage bag and threw it away. However, things are quite different now. We have strict rules for recycling. For example, as I told you before, we are supposed to separate items made of plastic, paper, what else? Umm... yeah! Metal, and glass. Also, all the containers have to be rinsed and their labels are to be taken away. Plus, like I said in the last question, each district has its own pickup area and day, so we need to take the recyclables to the designated area on the collection day. I would say recycling has become part of our daily lives here. Even though it is kind of tiresome, we try our best to do what we can do for the environment and our next generation."},{"n":10,"src":"그대로","q":"Tell me about a time you had a problem or a memorable experience related to recycling. What happened, and how did you handle it?","a":"A couple of weeks ago, I went outside to take the recyclables to the pickup area. Usually the time of the day I went was quiet. However, at that time, I found a lot of people buzzing around or gathering together while looking at something. As I came close to them, I could see a famous actor filming there. Even though he was wearing a pair of sweatpants and a sweatshirt, he looked so fabulous. It was my first time to see a celebrity in person. So, I kept watching him until his break time. Luckily, I could take a picture with him and get his autograph as well. Since then, I've become his fan. Every time I watch him on TV, that brings back the good memory and makes me smile."}]},{"label":"Set 4","items":[{"n":11,"src":"그대로","q":"I'd like to give you a situation and ask you to act it out. You want to go to a concert with a friend. Call the ticket office and ask three or four questions to get the information you need to buy tickets.","a":"Hello, I'm calling to get some information about the concert tonight. The thing is that I want to buy two tickets for the concert, so I want to ask you a few questions about it. First of all, are there any available tickets tonight? Yes? Then, what time are they available? I prefer evening time. Is it possible? Good! Also, can you tell me what the price range is? Because I live on a tight budget, I need something affordable. So, if any promotions are going on, please let me know. Oh! Can I pay by credit card? Yes? Then, can I pay in installments? And in how many months can I pay for? I'd like to pay in installments over 3 months. Lastly, can I get a full refund if something urgent comes up? What is your refund policy? Okay, I'll make sure to present the confirmation letter. Okay, these are all of my questions. Thanks for your help. Bye!"},{"n":12,"src":"응용","q":"I'm sorry, but there is a problem I need you to resolve. When you arrive at the concert hall, you realize that the tickets you bought are for a different date. Call your friend, explain the situation, and suggest two or three alternatives.","a":"Hi, it's me. I'm sorry to tell you this, but I have a problem with the concert tickets. The thing is that I've just found out that the tickets I bought are for a different date, so we can't get in today. I'm so sorry and here are some suggestions to make up for it. First of all, why don't we switch the date? The tickets are for next Saturday, so if you are free then, we can do it together as we plan. If it doesn't work for you, how about going there with your friend? I'm sure there would be anyone who wants to take my place. Then, you'll have fun there. I don't want you to miss it because of me. If you don't want to go any longer, cause it's our plan, I'll refund the tickets or sell them. We can arrange another event any time. Plus, I'll take you to dinner some time soon. If you have another idea, feel free to let me know. I'm sorry again for this inconvenience. Bye!"},{"n":13,"src":"그대로","q":"That's the end of the situation. Have you ever had a problem or had plans canceled when you were going to a concert or a performance? Tell me what happened and how you resolved it.","a":"I had a similar experience in the past. A few months ago, my friends and I wanted to have a birthday party for our friend at a nice restaurant and I was asked to book a table for the party. A week before the day, I called our favorite restaurant to ask for a table for four, but I was told that all tables were fully reserved, because it was Christmas season. In order to deal with the problem, I tried calling several restaurants, but almost all restaurants got booked up. In addition, the prices of the menus were too expensive. After all, I ended up changing the plan and had to throw the party in my place instead. I ordered in pizza from her favorite and also went to a market nearby to buy more food, dessert and drinks for our party. Even though the original plan didn't proceed as we planned, we had fun celebrating her birthday. From this experience, I learned to make a reservation well in advance when arranging a special occasion. Since then, I've never made the same mistake."}]},{"label":"Set 5","items":[{"n":14,"src":"응용","q":"Tell me how the way people listen to music has changed over the years. How did people listen to music in the past, and how do they listen to it today?","a":"There have been changes in the way people listen to music. In the past, when I was in my teens, we had to buy CDs or cassette tapes to listen to our favorite songs. We also used a portable player like an MP3 player, so we had to carry around another device and download the songs one by one. However, nowadays, most of us listen to music on our smartphone. As we carry around the smartphone all the time, we don't have to bring another music device and also easily listen to music anywhere and anytime. Besides, we can use some applications like YouTube and Melon, which is a music streaming service. Then, we can listen to a lot of songs and choose whatever we want depending on our mood. Actually, the best part is we can connect to Wi-Fi networks everywhere. That means we can enjoy listening to music for free. I believe these changes have dramatically improved the way we enjoy music in our everyday lives."},{"n":15,"src":"응용","q":"There are various issues related to the music industry, such as illegal downloading or rising concert ticket prices. Choose one issue and explain why people are concerned about it. What do you think should be done about it?","a":"Well, this is a really tough question. Actually, I've never thought about it, but when it comes to a music related issue, I'll try to do my best to tell you about the problem we are currently facing. As we all know, people love to listen to music anywhere and anytime these days. However, because of that, illegal downloading has become a serious problem. That means, even though artists spend a lot of time and money making their songs, they can't get paid properly for their work. It is a hot topic in Korea and it has been treated a lot on the news nowadays. So, the government has already made strict rules about it, and many people have moved to music streaming services like Melon or Spotify, which are legal and not expensive at all. Even though most people have tried to pay for music, it seems some are still downloading songs illegally. Thus, in order to deal with this issue, we should work together. I believe more people should focus on this matter again and have to make a sincere effort to solve this problem."}]}]},{"no":2,"title":"모의고사 2회","groups":[{"label":"시작","items":[{"n":1,"src":"응용","q":"Let's start the interview. Tell me about yourself and your family. Who do you live with?","a":""}]},{"label":"Set 1","items":[{"n":2,"src":"그대로","q":"You indicated in the survey that you like watching movies. What kinds of movies do you enjoy the most, and why? Tell me about your favorite genre in detail.","a":"I like all kinds of movies, but I love musical movies most. There are some reasons why I like them the most. First of all, actually my friend is a singer and a dancer, so she starred in musical movies. My favorite is Mamma Mia, because she is amazing in the movie. Her songs are so energetic and entertaining that I feel excited and relieve stress after watching it. That makes me be a fan of musical movies now. In addition, I can enjoy both music and a story at the same time. Also I am always impressed to see how well the cast performs in this type of movies. That's why I love musical movies."},{"n":3,"src":"응용","q":"Tell me about the last movie you watched. What was it about, where did you watch it, and who were you with? Describe it from beginning to end.","a":"The last movie I watched was Mamma Mia. A couple of weeks ago, I went to see it with my friend who has a similar taste in movies. We often go to the movie theater, named CGV, which is located in my neighborhood. Before going to see the movie, we first searched on the internet to find out the recent releases. After we chose a movie, we booked tickets online because we did not want to waste time waiting in line. When we got to the theater, we found our seats and turned off our smartphones. It's a light, sometimes silly, romantic musical comedy. The story is about a bride-to-be trying to find her real father so that he can give her away to her groom. Also it features gorgeous scenery, a catchy soundtrack and a well-known cast who are very talented. So I was impressed by their great performances throughout the entire movie. When the movie ended, we went to a restaurant nearby to have dinner together. We loved to chat about it at the dinner table. Whenever I watch a movie with her, we have a great time. That makes us choose another movie to watch together over dinner."},{"n":4,"src":"그대로","q":"Tell me about a movie that left a strong impression on you. When did you watch it, and why do you still remember it?","a":"A couple of weeks ago, I went to see a movie with my friend who has similar tastes in movies. Because both of us love musical films, we decided to watch one of the kinds, Mamma Mia. It's a light, sometimes silly, romantic musical comedy. The story is about a bride-to-be trying to find her real father so that he can give her away to her groom. Also it features gorgeous scenery, a catchy soundtrack and a well-known cast who are very talented. So I was impressed by their great performances throughout the entire movie. When it was over, we spent several hours chatting about it over coffee. Also, we even found and played some of the songs in the movie and sang along. That left us a big smile on our face. As we loved it, we still talk about it at times."}]},{"label":"Set 2","items":[{"n":5,"src":"응용","q":"You said you like walking and jogging. Where do you usually walk or jog? Describe the place in as much detail as possible.","a":"I'd like to talk about a park called Lake Park. There are many reasons why I like it the most. First of all, it is not far from where I live. It is just 5 minutes away from my house, so I can easily go there. Also, as the name indicates, it has a huge lake at the center, and around it there are several good walking and jogging tracks. That means I don't have to plan my jogging route. So when I walk there, I can enjoy the beauty of nature and relieve stress. In addition, the park is so popular that I can see many people working out there all the time. That makes me feel safe and motivated to do it more. Plus, there is a traditional market nearby, which is famous for fresh local food. It's so fresh and delicious and served at a reasonable price. Even though it is sometimes a bit crowded, I believe it is still the best place to give so much happiness and comfort."},{"n":6,"src":"그대로","q":"Tell me about your walking routine. When do you go, how long do you walk, and what do you do while walking?","a":"When I have free time, I try to do something fun to escape from everyday routine. Usually, I go to a park nearby. We have many good parks in the city, so they can be used for a nice walk. Typically, there is a big lake at the center and around it, there are good walking paths. I always walk on the track which takes about an hour to go all the way around it. That's perfect for my workout. Also, I often watch some movies there on my smartphone after the walk. They are so energetic and entertaining that I can relieve stress and refresh myself. I believe these are great ways to enjoy my free time and cheer myself up at a park."},{"n":7,"src":"응용","q":"Has anything unexpected ever happened while you were walking or jogging? Maybe you got hurt, or the weather changed suddenly. Tell me what happened and what you did.","a":"Yes, I'll never forget what happened last summer. One morning, I went to Lake Park for jogging as usual. The weather was fine when I left home, so I didn't check the forecast. However, something horrible happened when I was almost halfway around the track. It suddenly started raining heavily and I had nothing to cover myself with. In order to deal with the problem, I tried to run to the nearest shelter, but the ground was already slippery. While running, I slipped and hurt my ankle. After all, I ended up calling my brother and he came to pick me up. Luckily, it wasn't a serious injury and I could walk again in a few days. From this experience, I learned to check the weather forecast before going out and always wear running shoes that fit well. Since then, I've never made the same mistake."}]},{"label":"Set 3","items":[{"n":8,"src":"그대로","q":"I'd like to know about the weather in your country. What are the seasons like, and which season do you like the most?","a":"Korea has four seasons and each has very distinctive features. As the cold weather fades in spring, flowers and trees sprout buds and start to bloom. In summer, the temperature gradually increases and it gets very hot and humid. We have the monsoon season for about a month and the weather gets really muggy. In fall, it gets cooler and many people go outside to do outdoor activities, particularly going hiking to enjoy autumn leaves. In winter, it gets colder and snows, so everything freezes. That is the time people go skiing. As I told you, we have such an obvious difference in each season, so we can have a different lifestyle and enjoy various activities during every season. Personally, I like fall the most because the weather is perfect for a walk at a park."},{"n":9,"src":"응용","q":"How has the weather in your country changed over the years? Compare the weather in the past with the weather today.","a":"Well, there have been changes in the weather in my country. In the past, Korea had four seasons and each had very distinctive features. Spring and fall were long enough for us to enjoy outdoor activities. However, things are quite different now. Because of climate change, summer gets longer and hotter every year. For example, last summer, the temperatures reached over 35 degrees Celsius and they didn't go down below 30 degrees Celsius even at night for a couple of weeks. Also, the monsoon season has become less predictable. Sometimes we have heavy rain all of a sudden, which causes a lot of damage. On the other hand, winter is getting shorter, and we don't have as much snow as before. I would say the four seasons are not as clear as they used to be. From the experience, I learned to pay attention to the weather warnings."},{"n":10,"src":"그대로","q":"Tell me about a time when the weather caused a problem for you. What happened, and how did you deal with it?","a":"I'll never forget the summer this year. The whole country suffered under the most horrible heat wave we've never had in decades. During the day time, the temperatures reached over 35 degrees Celsius and they didn't go down below 30 degrees Celsius even at night for a couple of weeks. So I did everything I could do to stay cool in the summer heat. For example, I turned my air conditioner up to the max and never went out during the hot, sticky days. Even a few people died as a result of the scorching weather. I still remember how shocking it was at that time. From the experience, I learned to pay attention to the warnings."}]},{"label":"Set 4","items":[{"n":11,"src":"응용","q":"I'd like to give you a situation and ask you to act it out. You are planning a trip inside your country. Call a hotel and ask three or four questions to get the information you need before booking a room.","a":"Hello, I'm calling to get some information about your rooms. The thing is that I'm planning a trip to your city, so I want to ask you a few questions about it. First of all, are there any available rooms this Friday? Yes? Then, what type of rooms are available? I need a room for two, so a twin room would be great. Is it possible? Good! Also, can you tell me what the price range is? Because I live on a tight budget, I need something affordable. So, if any promotions are going on, please let me know. In addition, what time is check-in and check-out? I'd like to check in early if possible. Oh! Can I pay by credit card? Yes? Then, is breakfast included in the price? Lastly, can I get a full refund if something urgent comes up? What is your refund policy? Okay, I'll make sure to present the confirmation letter. These are all of my questions. Thanks for your help. Bye!"},{"n":12,"src":"응용","q":"I'm sorry, but there is a problem I need you to resolve. You arrive at the hotel, but they say there is no reservation under your name. Explain the situation to the staff and suggest two or three ways to solve the problem.","a":"Hello, this is Jules. There seems to be a problem with my reservation. The thing is that I booked a room here two weeks ago, but you're telling me there is no reservation under my name. I have the confirmation letter on my phone, so let me show it to you. To deal with the problem, here are some suggestions I can come up with. First of all, could you check the reservation one more time with my phone number? I might have booked it under a different name. If it's still not there, how about giving me another room at the same price? As you know, it's already late at night and I have nowhere else to go tonight. Any room would be fine as long as it's for two people. If you can't accept my suggestion, could you find me a room at a nearby hotel and cover the difference? I definitely hope to work out a solution to this problem with you. If you have another idea, feel free to let me know. I want you to get back to me as soon as possible."},{"n":13,"src":"그대로","q":"That's the end of the situation. Have you ever had a problem during a trip, such as a booking issue or a cancellation? Tell me what happened and how you handled it?","a":"I had a similar experience in the past. A few months ago, my friends and I wanted to have a birthday party for our friend at a nice restaurant and I was asked to book a table for the party. A week before the day, I called our favorite restaurant to ask for a table for four, but I was told that all tables were fully reserved, because it was Christmas season. In order to deal with the problem, I tried calling several restaurants, but almost all restaurants got booked up. In addition, the prices of the menus were too expensive. After all, I ended up changing the plan and had to throw the party in my place instead. I ordered in pizza from her favorite and also went to a market nearby to buy more food, dessert and drinks for our party. Even though the original plan didn't proceed as we planned, we had fun celebrating her birthday. From this experience, I learned to make a reservation well in advance when arranging a special occasion. Since then, I've never made the same mistake."}]},{"label":"Set 5","items":[{"n":14,"src":"응용","q":"More and more people these days choose to stay home during their vacation instead of traveling. Why do you think this is happening? Explain the reasons in detail.","a":"Well, more and more people these days choose to stay home during their vacation, and I think there are some reasons for that. First of all, traveling has become quite expensive. Flight tickets and hotels cost a lot, especially during the holiday season, so many people who live on a tight budget prefer to save money by staying home. Also, popular places are always crowded on holidays. Even though people go there for a rest, they end up waiting in line and getting stuck in traffic, so they feel more exhausted after the trip. In addition, we can enjoy so many things at home nowadays. We can watch movies through streaming services, order in food from a local restaurant, and go to a park nearby for a walk. I believe that's why staying home has become one of the popular ways to spend a vacation."},{"n":15,"src":"응용","q":"Some people say staying home is a waste of a vacation, while others say it's the best way to rest. What do you think, and why? Give me some examples to support your opinion.","a":"Well, some people say staying home is a waste of a vacation, but I don't think so. In my opinion, staying home is one of the best ways to rest, and there are two reasons why I think that way. First of all, the purpose of a vacation is to relieve stress and refresh ourselves. When we travel, we have to plan everything, pack our bags, and move around all day. That could be fun, but it's also tiring. On the other hand, when we stay home, we can really take a rest without any schedule. For example, during my last vacation at home, I watched musical movies all day and went to a park nearby for a walk in the evening. That was perfect for me. Second, we can save a lot of money. Because I live on a tight budget, I'd rather spend that money on something else. Of course, I understand people who love traveling, because seeing new places gives us a lot of energy. However, I believe what matters is not where we are, but how much we can relax."}]}]},{"no":3,"title":"모의고사 3회","groups":[{"label":"시작","items":[{"n":1,"src":"응용","q":"Let's begin. Please tell me about yourself. What do you do these days, and how do you usually spend your time?","a":""}]},{"label":"Set 1","items":[{"n":2,"src":"응용","q":"You indicated in the survey that you enjoy going to performances. What kinds of performances do you like, and where do you usually go to see them? Describe the place in detail.","a":"As for the kinds of performances, I like musicals and pop concerts the most, because I can enjoy both music and a story at the same time. The concert hall I visit most often is located in downtown in the city of Suwon. It is on the 2nd floor of a big building. When seen from the outside, it looks new and modern because it's well-maintained. When you come inside, you can see a big and long counter at the center, and around it there are ticket machines and a snack bar. Straight ahead, you can see many concert posters hanging on the wall. In the hall, there is a big stage and great speakers. My favorite part is the staff. They are so friendly that they always smile and wish me a good day when I'm there. That makes me feel good and comfortable."},{"n":3,"src":"응용","q":"Walk me through what you usually do when you go see a performance. What do you do before the show, during the show, and after it ends?","a":"When I go to a performance, I usually go with my friend who has a similar taste in music. Before going to see a show, we first search on the internet to find out which performances are coming up. After we choose one, we book tickets online because we do not want to waste time waiting in line. On the day, we meet a couple of hours earlier and have lunch at a restaurant nearby. When we go to the hall, we find our seats and turn off our smartphones. During the show, we just focus on the stage and enjoy the songs. Sometimes we sing along and clap together with other people. When the performance ends, we go to a coffee shop nearby to talk about it. We love to chat about the best scenes over coffee. Whenever I go to a performance with her, we have a great time. That makes us choose another show to watch together."},{"n":4,"src":"응용","q":"Tell me about the most memorable performance you have ever seen. What was it, who did you go with, and why do you still remember it?","a":"A couple of weeks ago, I went to see a concert with my friend who has similar tastes in music. Because both of us love the singer IU, we decided to go to her concert. She is very famous as both an actress and a singer. During the show, she sang all of my favorite songs and even talked to the audience between the songs. Her songs are so energetic and entertaining that I could relieve stress and refresh myself. Also, the stage was amazing with beautiful lights, so I was impressed by her great performance throughout the entire concert. When it was over, we spent several hours chatting about it over coffee. We even played some of the songs from the concert and sang along. That left us a big smile on our face. As we loved it, we still talk about it at times."}]},{"label":"Set 2","items":[{"n":5,"src":"그대로","q":"You said you like going to the beach. Tell me about a beach you often visit. What does it look like, and what can people do there?","a":"I'd like to talk about a beach in Jeju Island. There are many reasons why I like it the most. First of all, it is not far from where I live. It takes about only one hour by plane, so I can save time. Also it has beautiful scenery and especially it's well-known for a magnificent beach. So when I relax there, I can enjoy the beauty of nature and relieve stress. In addition, I can enjoy a wide range of events often happening there, from music concerts to local community events. They are fun, informative, and free. Plus, there is a traditional market nearby, which is famous for fresh local food. It's so fresh and delicious and served at a reasonable price. Thus, when I'm there, I always have a lot of fun and even have a chance to meet new people who are usually nice and friendly. I think that's a great way to make friends. Even though it is sometimes a bit crowded, I believe it is still the best place to give so much happiness and comfort."},{"n":6,"src":"그대로","q":"What do you usually bring when you go to the beach, and what do you do there? Tell me about a typical day at the beach from morning to evening.","a":"When I have free time, I try to do something fun to escape from everyday routine. Usually, I go to a beach nearby. We have many good beaches in the country, so they can be used for our vacation spots. Typically, there is a beautiful beach and around it, there are good walking paths, so they can be used for a nice walk. I usually walk on one of the tracks and relax on the bench around the beach. As for what I bring, I take a mat, a swimsuit, sunblock, and some snacks and drinks. Also, I often watch some movies there on my smartphone. They are so energetic and entertaining that I can relieve stress and refresh myself. I believe these are great ways to enjoy my free time and cheer myself up."},{"n":7,"src":"그대로","q":"Tell me about a memorable trip to the beach. When was it, who were you with, and what made it special?","a":"A couple of weeks ago, I went to a beach near my house for a walk with my friend. Usually the time of the day we went was quiet, so we wanted to spend quality time catching up with each other. However, at that time, I found a lot of people buzzing around or gathering together while looking at something. As I came close to them, I could see a famous actor filming there. Even though he was wearing a pair of sweatpants and a sweatshirt, he looked so fabulous. It was my first time to see a celebrity in person. So, I kept watching him until his break time. Luckily, I could take a picture with him and get his autograph as well. Since then, I've become his fan. Every time I watch him on TV, that brings back the good memory and makes me smile."}]},{"label":"Set 3","items":[{"n":8,"src":"그대로","q":"I'd like to know about the place you live in. Describe your home. How many rooms are there, and which room do you like the most?","a":"My house is located in a residential area in the city of Suwon. It is on the 2nd floor of an apartment building. When seen from the outside, it looks old because it was built quite a while ago, but it's well-maintained. When you come inside, you can see a living room at the center, and around it there are bedrooms, a kitchen, and a balcony. It has 3 bedrooms, so everyone in my family has our own room. Straight ahead, you can see a big family photo hanging on the wall. My favorite spot is my room. Since it has a window that takes in the view of the city and comfy sofas, the atmosphere is great. So, I enjoy sitting on the sofa and watching the view outside. That makes me feel good and comfortable."},{"n":9,"src":"그대로","q":"Tell me about the changes you have made to your home. Did you buy new furniture, change the color of a room, or move things around? Why did you make those changes?","a":"Nowadays, my family spend more time than usual lounging around the living room and binge-watching Netflix. While it may be necessary to stay home for a rest, staying indoors too long can cause harmful effects like depression. I think we needed a change to lighten the mood. So, we got started with rearranging the furniture in the living room. For optimal TV viewing, we angled the sofa and side chairs so that every spot feels like the best seat in the house. Also, we decided to introduce a natural element to our home. I bought a bundle of fresh flowers and some greenery. By doing so, we could bring a touch of the outdoors in. Now, we love all of these mini home makeovers. I guess I will play with rearranging other furniture and decor for a fresh look before long."},{"n":10,"src":"그대로","q":"Tell me about a problem you had at home, such as something breaking down or a repair you needed. What happened, and how did you solve it?","a":"When I was young, I came back home from school and felt hungry. As there was nothing to eat in the fridge, I decided to cook instant noodles and started to boil water in a pot. Since I was supposed to wait for a few minutes until the water boiled, I turned on TV and watched a comedy show. The show was so funny that I got really into it. So, it took me a while to realize that I left the pot on the stove. I rushed into the kitchen. As soon as I walked in, I could smell the burnt odor. The pot boiled dry. I had to take off the layer of burn on an empty stomach, before my mom came home, which was really hard. Since then, I always keep an eye on the pot when I put it on the stove."}]},{"label":"Set 4","items":[{"n":11,"src":"응용","q":"I'd like to give you a situation and ask you to act it out. You want to see a movie this weekend. Call your friend and ask three or four questions to decide which movie to watch and when to meet.","a":"Hi, it's me. I'm calling to get some information about your schedule. The thing is that I want to see a movie with you this weekend, so I want to ask you a few questions about it. First of all, are you available this Saturday? Yes? Then, what time is good for you? I prefer afternoon time. Is it okay? Great! Also, what kind of movies do you want to watch? Actually, I searched on the internet and found that there are a few new releases. If you tell me what you like, I'll book the tickets online. Plus, how should we go there? Should we drive there? If so, do you happen to know whether there is a free parking lot? Oh! Sounds perfect! Lastly, do you want to have dinner after the movie? As I remember, you love Italian food. If you still love it, I'll reserve a table at a restaurant nearby. Okay, these are all of my questions. Thanks for your help. Bye!"},{"n":12,"src":"그대로","q":"I'm sorry, but there is a problem I need you to resolve. On the day of the movie, you suddenly cannot go. Call your friend, explain why, and suggest two or three alternatives.","a":"Hi, it's me. I'm sorry to tell you this, but I have a problem with going to the movies today. The thing is that something urgent has come up and I have to deal with it, so we'd better postpone the plan. I'm so sorry and here are some suggestions to make up for it. First of all, why don't we switch the date? Then, we can do it together as we plan. I'll be free next weekend, so it'll be great if we change the schedule. If it doesn't work for you, how about going there with your friend? I'm sure there would be anyone who wants to take my place. Then, you'll have fun there. I don't want you to miss it because of me. If you don't want to go any longer, cause it's our plan, I'll refund the tickets or sell them. We can arrange another event any time. Plus, I'll take you to dinner some time soon. If you have another idea, feel free to let me know. I'm sorry again for this inconvenience. Bye!"},{"n":13,"src":"그대로","q":"That's the end of the situation. Have you ever had to cancel plans with a friend at the last minute? Tell me what happened and how your friend reacted.","a":"I had a similar experience in the past. A few months ago, my friends and I wanted to have a birthday party for our friend at a nice restaurant and I was asked to book a table for the party. A week before the day, I called our favorite restaurant to ask for a table for four, but I was told that all tables were fully reserved, because it was Christmas season. In order to deal with the problem, I tried calling several restaurants, but almost all restaurants got booked up. In addition, the prices of the menus were too expensive. After all, I ended up changing the plan and had to throw the party in my place instead. My friends understood the situation and nobody complained about it. I ordered in pizza from her favorite and also went to a market nearby to buy more food, dessert and drinks for our party. Even though the original plan didn't proceed as we planned, we had fun celebrating her birthday. From this experience, I learned to make a reservation well in advance when arranging a special occasion. Since then, I've never made the same mistake."}]},{"label":"Set 5","items":[{"n":14,"src":"그대로","q":"Tell me about the music people in your country listen to these days. What is popular now, and how is it different from the music that was popular in the past?","a":"There have been changes in music in my country. When I was in my teens, dance music was popular. At that time, we loved to listen to it as it was so energetic and entertaining that it helped us improve our mood and feel excited. In our free time, my friends and I usually gathered around and listened to this type of music together. However, nowadays, there are many different types of music, and K-pop idol groups are the most popular ones. Also, many people often listen to classical music or ballads, which are inspiring and allow us to relax our mind and body from anxiety. We often play them before we do something important. Then, they help us feel light-hearted and concentrate. Both types of music are quite different, but I love both, so I can't live without them."},{"n":15,"src":"응용","q":"Some people say live concerts are much better than listening to recorded music, while others disagree. What do you think, and why? Give me some reasons and examples.","a":"Well, some people say live concerts are much better than recorded music, and I agree with them. There are two reasons why I think that way. First of all, at a live concert, I can enjoy both music and a performance at the same time. The singer's voice, the lights, and the stage make everything so energetic and entertaining that I can relieve stress and refresh myself. For example, when I went to IU's concert a couple of weeks ago, I sang along with thousands of people, and I still remember how exciting it was. Second, at a concert, I can feel that I'm sharing the moment with other fans. That's something I can never get from listening to music alone. However, I understand people who prefer recorded music. Concert tickets are expensive and we can't go to a concert every day. Also, we can listen to recorded music anywhere and anytime on our smartphone. So, I would say both are good, but for me, nothing beats a live concert."}]}]},{"no":4,"title":"모의고사 4회","groups":[{"label":"시작","items":[{"n":1,"src":"응용","q":"Let's get started. Tell me about yourself. What kind of person are you, and what do you enjoy doing in your free time?","a":""}]},{"label":"Set 1","items":[{"n":2,"src":"그대로","q":"You indicated in the survey that you enjoy listening to music. What kind of music do you like, and who is your favorite singer or musician? Tell me about them in detail.","a":"Let me tell you about my favorite singer. Her name is IU. Actually, we live in the same apartment complex, so it takes about only 5 minutes to go to her house from where I live. That makes us close to each other and spend time together at least once a week. She is such an amazing person, because she is a very talented singer and actor. She played one of the main characters in the musical movie, 'Mamma Mia' in Korea. Her songs in the movie are so energetic and entertaining that I can relieve stress and refresh myself, so this type of music becomes my favorite. Every time I see her, I want to be like her."},{"n":3,"src":"응용","q":"When and where do you usually listen to music? What device do you use, and what are you usually doing while you listen? Describe a typical day.","a":"I usually listen to music on my smartphone when I go out by subway. There are a few reasons why I love to do that. First of all, as I carry around my smartphone all the time, I don't have to bring another music device and also easily listen to music anywhere and anytime. In addition, I can use some applications like YouTube and Flow, which is a music streaming service. Then, I can listen to a lot of songs and choose whatever I want depending on my mood. Actually, the best part is I can connect to Wi-Fi networks everywhere. That means I can enjoy listening to music for free. As you can guess, I'm a music lover since music gets me excited and helps relieve stress. Thus, listening to music is a great way to refresh myself when coming and going somewhere."},{"n":4,"src":"그대로","q":"Tell me about how you first became interested in music. When was it, and what made you start liking it?","a":"I started listening to music when I was a child, because of my brother who was crazy about music. He usually listened to music with his friends, but one day, he recommended listening to one of his favorite songs with him. It was the time when I first got interested in music. The music I listened to that day was Coldplay's. It was British rock music which was not really my thing. However, I fell in love with the lead singer, Chris Martin. His voice, singing skills and actually everything was perfect. Thanks to him, I was totally mesmerized by the charm of music. Ever since then, I've kept listening to various types of music. Thus, listening to music has been my favorite pastime and I can't still live without it."}]},{"label":"Set 2","items":[{"n":5,"src":"응용","q":"You said you like going to concerts. Tell me about a concert hall or venue you have been to. What does it look like inside, and how big is it?","a":"The concert hall I go to most often is located in downtown in the city of Suwon. It is a big round building and it can hold about ten thousand people. When seen from the outside, it looks new and modern because it's well-maintained. When you come inside, you can see a big and long counter at the center, and around it there are ticket machines and a booth selling goods. Straight ahead, you can see many concert posters hanging on the wall. In the hall, there is a huge stage with great speakers and lights, and the seats go up like stairs, so everyone can see the stage well. My favorite part is the staff. They are so friendly that they always smile and wish me a good day when I'm there. That makes me feel good and comfortable."},{"n":6,"src":"응용","q":"What do you usually do when you go to a concert? Tell me everything from buying the ticket to going back home.","a":"When I go to a concert, I usually go with my friend who has a similar taste in music. Let me tell you everything from the beginning. First, we search on the internet to find out which concerts are coming up. After we choose one, we book the tickets online because we do not want to waste time waiting in line. On the day, we meet a couple of hours earlier and have lunch at a restaurant nearby. Then, we go to the concert hall and buy some goods, like a T-shirt or a light stick. When we go inside, we find our seats and turn off our smartphones. During the concert, we sing along and clap together with other people. When it's over, we go to a coffee shop nearby to talk about the best songs. Finally, we take the subway back home. Whenever I go to a concert with her, we have a great time. That makes us choose another concert to go to together."},{"n":7,"src":"응용","q":"Tell me about the best concert you have ever been to. Who was performing, who did you go with, and what made it so good?","a":"The best concert I've ever been to was Coldplay's. Actually, it was also my first concert. I started going to concerts when I was a child, because of my brother who was crazy about concerts. He usually went to concerts with his friends, but one day, he recommended going to a concert with him. The concert I went to that day was Coldplay's. It was British rock music which was not really my thing. However, I fell in love with the lead singer, Chris Martin. His voice, singing skills and actually everything was perfect. The stage was amazing with beautiful lights, and thousands of people were singing along together. It was so energetic and entertaining that I could relieve stress and refresh myself. Thanks to him, I was totally mesmerized by the charm of concerts. Ever since then, I've kept going to various concerts. Every time I listen to their songs, that brings back the good memory and makes me smile."}]},{"label":"Set 3","items":[{"n":8,"src":"응용","q":"I'd like to know how people in your country use the internet. What do they usually do online, and what devices do they use?","a":"Let me tell you about how people in my country use the internet. The device we use the most is absolutely the smartphone. As we carry around the smartphone all the time, we can easily use the internet anywhere and anytime. Also, we can connect to Wi-Fi networks everywhere, so we can even use it for free in most places. As for what people do online, first of all, many of us listen to music or watch videos through applications like YouTube and Melon, which is a music streaming service. Then, we can choose whatever we want depending on our mood. Besides, most of us do internet banking, which makes it possible for us to save a huge amount of time, compared to the past. Plus, we do a lot of online shopping, because it's much more convenient than going to a store. For those reasons, I would say the internet has become part of our daily lives here."},{"n":9,"src":"그대로","q":"How has the internet changed people's daily lives compared to the past? Tell me about the biggest differences.","a":"Nowadays, technology has advanced tremendously and it's used almost everywhere in our daily lives. Particularly, there are so many amazing ways artificial intelligence, also known as AI, is used by most people from morning until night. Above all, smart devices like smartphones or tablet PCs have gone essential and their voice command bots, like Apple's SIRI, Samsung's Bixby, and Amazon's Alexa, make life more efficient and easier. For example, we can get directions to our lunch spot or inquire about the weather for our day by simply asking them. Then, they return answers to us by using AI, so we can save time by more talking than hitting the buttons on the screen. I believe AI can dramatically improve the efficiencies of our everyday lives."},{"n":10,"src":"그대로","q":"Tell me about a time you had a problem with the internet or your phone. What happened, and how did you fix it?","a":"I had some problems with the internet. Last month, I wanted to buy summer clothes online, so I visited online shopping malls on my phone and found what I liked. When I paid for it, I realized that I forgot my password for the site. I tried to reset the password by clicking the button, but it didn't work. All I could see was the error page only. Eventually, I had to use my laptop to do the whole process again. I still don't understand what caused the problem. Using the internet is easy and convenient, but sometimes there are hassles like this one."}]},{"label":"Set 4","items":[{"n":11,"src":"응용","q":"I'd like to give you a situation and ask you to act it out. You want to visit a new park this weekend. Call the park office and ask three or four questions about the park before you go.","a":"Hello, I'm calling to get some information about your park. The thing is that I'm planning to visit there this weekend for the first time, so I want to ask you a few questions about it. First of all, what time does the park open and close? I prefer morning time. Is it open early? Good! Also, is there an entrance fee? If so, how much does it cost? Because I live on a tight budget, I need something affordable. So, if any promotions are going on, please let me know. In addition, is there a parking lot nearby? This time I need to drive there. Do you provide free parking to visitors? If not, how much does it cost to park there for about an hour? Plus, do you know if there are good walking trails around the place? Then, we need to wear comfortable shoes for a walk. Lastly, are there any events going on this weekend? I heard that there are often music concerts or local community events at parks. Okay, these are all of my questions. Thanks for your help. Bye!"},{"n":12,"src":"그대로","q":"I'm sorry, but there is a problem I need you to resolve. On the day of your visit, it starts raining heavily. Call the friend you were going with, explain the situation, and suggest two or three other things you could do instead.","a":"Hi, it's me. I'm sorry to tell you this, but I have a problem with going to the park today. The thing is that I've just found out that there will be a heavy rainstorm today, so we'd better postpone the plan. To deal with the problem, here are some suggestions I can come up with. First of all, why don't we switch the date? Then, we can do it together as we plan. I'll be free next weekend, so it'll be great if we change the schedule. If it doesn't work for you, how about going to the movies instead? There are a few new releases, so I'll book the tickets online. I don't want you to waste your whole day because of the rain. If you don't want to go out at all, why don't we have lunch at my place? I'll order in some food from your favorite restaurant and we can watch a movie together at home. Plus, I'll take you to dinner some time soon. If you have another idea, feel free to let me know. Bye!"},{"n":13,"src":"응용","q":"That's the end of the situation. Have you ever had your outdoor plans ruined by bad weather? Tell me what happened and what you ended up doing.","a":"I had a similar experience in the past. A few months ago, my friends and I planned to go to a beach for a picnic and I was asked to book a place to stay. A week before the day, I reserved a room near the beach and we bought everything we needed. However, something horrible happened the day before we left. I found out on the news that a typhoon was coming, and the weather forecast said there would be heavy rain all weekend. In order to deal with the problem, I tried calling the place to change the date, but they told me the room was fully booked for the next few weeks. After all, I ended up cancelling the trip and had to throw a party in my place instead. I ordered in some food from a local restaurant and also went to a market nearby to buy more food, dessert and drinks for our party. Even though the original plan didn't proceed as we planned, we had a lot of fun. From this experience, I learned to check the weather forecast before making any outdoor plans. Since then, I've never made the same mistake."}]},{"label":"Set 5","items":[{"n":14,"src":"응용","q":"How do people in your country spend their free time these days? Has this changed compared to ten or twenty years ago? Explain the differences in detail.","a":"There have been changes in the way people spend their free time. In the past, let's say, ten or twenty years ago, people usually went outside to meet others. They gathered around and watched movies at a theater together, or went to a park nearby for a walk. At that time, we didn't have many choices at home, so going out was the main way to enjoy our free time. However, nowadays, things are quite different. Thanks to the internet, we can enjoy so many things at home. We watch movies through streaming services, listen to music on our smartphone, and even order in food from a local restaurant. Also, many people are more health conscious than before, so they work out regularly or go jogging at a park. I would say we have more options now, so people can choose whatever they want depending on their mood."},{"n":15,"src":"응용","q":"Some people say that people today have less free time than in the past, while others say they actually have more. What do you think, and why? Support your opinion with examples.","a":"Well, this is a really tough question. Actually, I've never thought about it, but I would say people today have less free time than in the past, and there are two reasons why I think that way. First of all, even though technology has advanced tremendously and made our lives more efficient, we are always connected. That means, even after work, many people keep checking their emails and messages on their smartphone. So, they can't really take a rest. Second, people have more things to do these days. They work out, study something new, and take care of their family, so their schedule is always full. For example, my friends are so busy that we don't have many chances to see each other. On the other hand, I understand people who say we have more free time. Machines do a lot of housework for us now, and many companies have shorter working hours than before. However, I believe having free time is one thing and really enjoying it is another."}]}]},{"no":5,"title":"모의고사 5회","groups":[{"label":"시작","items":[{"n":1,"src":"응용","q":"Let's start. Could you tell me about yourself? Where do you live, and what is a normal day like for you?","a":""}]},{"label":"Set 1","items":[{"n":2,"src":"그대로","q":"You indicated in the survey that you travel inside your country. Tell me about a place in your country that you have visited. What was it like, and what did you see there?","a":"I'd like to talk about Jeju Island. There are many reasons why I like it the most. First of all, it is not far from where I live. It takes about only one hour by plane, so I can save time. Also it has beautiful scenery and especially it's well-known for a magnificent beach. So when I relax there, I can enjoy the beauty of nature and relieve stress. In addition, I can enjoy a wide range of events often happening there, from music concerts to local community events. They are fun, informative, and free. Plus, there is a traditional market nearby, which is famous for fresh local food. It's so fresh and delicious and served at a reasonable price. Thus, when I'm there, I always have a lot of fun and even have a chance to meet new people who are usually nice and friendly. I think that's a great way to make friends. Even though it is sometimes a bit crowded, I believe it is still the best place to give so much happiness and comfort."},{"n":3,"src":"그대로","q":"What do you usually do when you travel inside your country? Tell me about a typical trip from the day you leave to the day you come back.","a":"During my last vacation, I visited Jeju Island with my close friends. It was one of my best friends' birthday, so I wanted to turn the day into a special occasion. That made us go there. First, we went to a beach which is famous for its picturesque landscape. It was so beautiful that there were already many people relaxing and having a picnic. I also reserved a spot in the picnic areas, and spread out a mat. Then, we ordered in some food from a local restaurant, which was her favorite. And there was a big traditional market nearby, so some of us went there to buy more food, dessert and drinks for our party. Since we were too busy to hang out at that time, it was a great chance to catch up with one another. Even though it was planned at the last minute, it turned out great. All of us had a lot of fun. The following day, we went to a sauna together because we all needed to relax. Overall, it was a great opportunity to have a blast with old friends, and we made up our minds to go there again next year."},{"n":4,"src":"그대로","q":"Tell me about the most memorable domestic trip you have taken. Where did you go, who were you with, and what happened?","a":"A couple of weeks ago, I went to a beach in Jeju Island for a walk with my friend. Usually the time of the day we went was quiet, so we wanted to spend quality time catching up with each other. However, at that time, I found a lot of people buzzing around or gathering together while looking at something. As I came close to them, I could see a famous actor filming there. Even though he was wearing a pair of sweatpants and a sweatshirt, he looked so fabulous. It was my first time to see a celebrity in person. So, I kept watching him until his break time. Luckily, I could take a picture with him and get his autograph as well. Since then, I've become his fan. Every time I watch him on TV, that brings back the good memory and makes me smile."}]},{"label":"Set 2","items":[{"n":5,"src":"그대로","q":"You said you sometimes spend your vacation at home. What do you usually do when you stay home during a holiday? Describe a typical day.","a":"When I have free time, I try to do something fun to escape from everyday routine. In order to get over my tiredness, I usually watch musical movies at home. They are so energetic and entertaining that I can relieve stress and refresh myself. Besides, I go to the park nearby for a walk almost every day. We have many good parks in the city, so they can be used for our daily workout. Usually, there is a big lake at the center and around it, there are good walking paths. Also, I order in some food from a local restaurant and have a nice meal with my family at home. I believe these are great ways to enjoy my free time and cheer myself up."},{"n":6,"src":"응용","q":"How is staying home during a vacation different from traveling somewhere? Compare the two and tell me what you like about each.","a":"Let me compare staying home and traveling somewhere. When I travel, I can see new places and meet new people. It's so exciting and entertaining that I can escape from my everyday routine completely. For example, when I went to Jeju Island last year, I enjoyed the beautiful scenery and fresh local food, which I can never get at home. However, traveling also takes a lot of time and money. I have to plan everything, pack my bags, and move around all day, so sometimes I feel more exhausted after the trip. On the other hand, when I stay home, I can really take a rest without any schedule. I usually watch musical movies at home. They are so energetic and entertaining that I can relieve stress and refresh myself. Besides, I go to a park nearby for a walk. Both are quite different, but I love both of them, so I choose one depending on how tired I am."},{"n":7,"src":"그대로","q":"Tell me about a vacation you spent at home that you still remember. When was it, and why do you remember it?","a":"A couple of weeks ago, when I spent a peaceful vacation at home, I went to a coffee shop near my house with my friend. Usually the time of the day we went was quiet, so we wanted to spend quality time catching up with each other. However, at that time, I found a lot of people buzzing around or gathering together while looking at something. As I came close to them, I could see a famous actor filming there. Even though he was wearing a pair of sweatpants and a sweatshirt, he looked so fabulous. It was my first time to see a celebrity in person. So, I kept watching him until his break time. Luckily, I could take a picture with him and get his autograph as well. Since then, I've become his fan. Every time I watch him on TV, that brings back the good memory and makes me smile."}]},{"label":"Set 3","items":[{"n":8,"src":"그대로","q":"I'd like to know about transportation in your country. What kinds of public transportation do people use, and which one is the most popular?","a":"In Korea, public transportation is well-developed. The main means of transportation are buses, subways, taxis, and trains. The most used one is the subway. We have the largest subway system with over 20 different subway lines and each of those is differentiated by a different color, which is easy to identify. Also, it is possible to transfer from one line to another without additional charges, so subways have long been recognized for the best public transportation in Korea. Besides, there are a number of intra-city and inter-city buses in Korea. There are hundreds of bus routes, and they go to every part of the city. Just like the subway, we can transfer to another bus with just a small additional fee. Nowadays, the government encourages people to use public transportation for saving the environment and energy. But I think we use public transportation a lot because it's cheaper than in other countries, and it's always on time."},{"n":9,"src":"그대로","q":"How has transportation in your country changed over the years? Tell me about the differences between the past and now.","a":"There has been a remarkable development in modern transportation. It has influenced a lot on many different sectors, such as tourism and trade business. In the past, let's say, in the 60s and 70s, steam trains were mainly used on land and then fossil fuels like natural gas and oil were discovered. Thus, vehicles like buses and trucks began to transport a lot of goods and passengers and the economy began to change. Since the 80s, a subway system was introduced and also planes were used to carry more and more people even at reasonable air fares. With each advancement in transportation technology, the standard of living increased dramatically, so that helped us to travel more often. Nowadays, many people own their car, which gives them a way to get around quickly and easily. I believe, today, the changes in transportation make leisure travel something common we can afford."},{"n":10,"src":"응용","q":"Tell me about a time you had a problem while using public transportation. What happened, and how did you deal with it?","a":"I had a similar experience in the past. A few months ago, I had an appointment with my friend in Seoul, so I decided to take the subway because it's the fastest way to get there. I left home early and thought I had enough time. However, something horrible happened when I was almost at the station. I found out that the subway had stopped because of a signal problem, and there were so many people waiting on the platform. In order to deal with the problem, I tried to wait for a while, but the announcement said it would take at least 30 minutes. After all, I ended up going outside and taking a bus instead. It was much slower because of the traffic, so I was about an hour late. I called my friend and apologized, and luckily she understood the situation. From this experience, I learned to check the traffic information before I leave home. Since then, I've never made the same mistake."}]},{"label":"Set 4","items":[{"n":11,"src":"응용","q":"I'd like to give you a situation and ask you to act it out. You are planning a trip to the beach with your family. Call a place that rents rooms near the beach and ask three or four questions before you book.","a":"Hello, I'm calling to get some information about your rooms. The thing is that I'm planning a trip to the beach with my family, so I want to ask you a few questions about it. First of all, are there any available rooms this Friday? Yes? Then, what time can we check in? I prefer early afternoon. Is it possible? Good! Also, can you tell me what the price range is? Because I live on a tight budget, I need something affordable. So, if any promotions are going on, please let me know. In addition, how far is it from the beach? If it's not far, we can walk there. Plus, is there a parking lot nearby? This time we need to drive there. Do you provide free parking to guests? Lastly, can I get a full refund if something urgent comes up? What is your refund policy? Okay, I'll make sure to present the confirmation letter. These are all of my questions. Thanks for your help. Bye!"},{"n":12,"src":"응용","q":"I'm sorry, but there is a problem I need you to resolve. After you book the room, your family suddenly cannot go on that date. Call the place, explain the situation, and suggest two or three solutions.","a":"Hello, this is Jules. There seems to be a problem with my reservation. The thing is that I booked a room for this Friday, but something urgent has come up in my family, so we can't go on that date. To deal with the problem, here are some suggestions I can come up with. First of all, could you change the date for me? We'll be free next weekend, so it'll be great if we can switch the reservation to next Friday. If the room is not available then, how about keeping my payment as a credit? Then, I'll use it within a few months when we can make it. If you can't accept my suggestion, is it possible to get a partial refund? I know it's close to the date, so I don't expect a full refund, but I definitely hope to work out a solution to this problem with you. If you have another idea, feel free to let me know. I want you to get back to me as soon as possible. Bye!"},{"n":13,"src":"그대로","q":"That's the end of the situation. Have you ever had to change or cancel a reservation? Tell me what happened and how it worked out.","a":"I had a similar experience in the past. A few months ago, my friends and I wanted to have a birthday party for our friend at a nice restaurant and I was asked to book a table for the party. A week before the day, I called our favorite restaurant to ask for a table for four, but I was told that all tables were fully reserved, because it was Christmas season. In order to deal with the problem, I tried calling several restaurants, but almost all restaurants got booked up. In addition, the prices of the menus were too expensive. After all, I ended up changing the plan and had to throw the party in my place instead. I ordered in pizza from her favorite and also went to a market nearby to buy more food, dessert and drinks for our party. Even though the original plan didn't proceed as we planned, we had fun celebrating her birthday. From this experience, I learned to make a reservation well in advance when arranging a special occasion. Since then, I've never made the same mistake."}]},{"label":"Set 5","items":[{"n":14,"src":"응용","q":"These days many people watch movies at home instead of going to the theater. Why do you think this is happening? Explain the reasons in detail.","a":"Well, more and more people these days watch movies at home instead of going to the theater, and I think there are some reasons for that. First of all, streaming services like Netflix have become really popular. With just one monthly payment, we can watch thousands of movies whenever we want. Because I live on a tight budget, that's much more affordable than buying a ticket every time. Also, watching at home is more comfortable. We don't have to drive there, wait in line, or worry about the parking lot. We can just lie back on the sofa and even stop the movie whenever we want. In addition, TVs have gone bigger and better these days, so the picture and sound quality at home are good enough. I believe that's why watching movies at home has become the usual way to enjoy them."},{"n":15,"src":"응용","q":"Do you think movie theaters will disappear in the future? What do you think, and why? Give me reasons and examples to support your opinion.","a":"Well, this is a really tough question. Actually, I've never thought about it, but I don't think movie theaters will disappear completely, and there are two reasons why I think that way. First of all, there are some movies we can only enjoy at a theater. For example, when I watched a musical movie, Mamma Mia, at the theater, the big screen and great speakers made everything so energetic and entertaining that I was totally mesmerized. I could never get that feeling at home. Second, going to the movies is not only about watching a movie. It's a way to spend time with someone. When I go to the theater with my friend, we have dinner at a restaurant nearby and chat about the movie afterwards. That's a big part of the fun. However, I believe the number of theaters will decrease, and they will focus more on special experiences, like 4D screens or huge IMAX screens. So, I would say theaters will survive, but in a different way."}]}]}];

const ICON_SPEAK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 2v2a8 8 0 010 16v2a10 10 0 000-20z"/></svg>';
const ICON_STOP  = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const ICON_CHEV  = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';

let currentTest = 0;
let speakingBtn = null;
let voices = [];
let chosenVoice = null;

/* ---------- 목소리 ---------- */
function pickBest(list){
  const saved = localStorage.getItem('opic-voice');
  if (saved){ const v = list.find(v => v.name === saved); if (v) return v; }
  const order = [
    v => v.name === 'Google US English',
    v => v.name.includes('Google') && v.lang === 'en-US',
    v => v.name.includes('Samantha'),
    v => v.lang === 'en-US',
  ];
  for (const test of order){ const v = list.find(test); if (v) return v; }
  return list[0] || null;
}
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
