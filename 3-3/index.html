<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPIc 3-3 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#EEF0F4; --card:#FFFFFF; --ink:#14233C; --soft:#5B6B84; --faint:#8593A8;
  --line:#DCE1E9; --audio:#0E7C86; --audio-bg:#DEF0F1; --rec:#B8403C; --rec-bg:#F8E7E6;
  --keep:#1D6647; --keep-bg:#E2F0E9; --adapt:#1C558F; --adapt-bg:#E4EDF8;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0F141D; --card:#19202B; --ink:#E7EBF2; --soft:#9AA8BD; --faint:#6F7E94;
    --line:#2A3342; --audio:#63C7CE; --audio-bg:#123338; --rec:#E0817D; --rec-bg:#38211F;
    --keep:#7FCBA5; --keep-bg:#152A21; --adapt:#8FB9E8; --adapt-bg:#15243A;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px; line-height:1.6;
}
.wrap{max-width:720px; margin:0 auto; padding:0 16px 64px}

header{padding:28px 0 18px}
h1{font-size:23px; font-weight:600; margin:0; letter-spacing:-.01em}
.sub{color:var(--soft); font-size:13.5px; margin:5px 0 0}

.bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:18px}
.tabs{display:flex; gap:6px; flex:1 1 auto; overflow-x:auto; scrollbar-width:none; min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--soft);
  border-radius:999px; padding:7px 15px; font-size:14px; font-family:inherit; cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:500}
select{
  border:1px solid var(--line); background:var(--card); color:var(--soft);
  border-radius:999px; padding:7px 12px; font-size:13px; font-family:inherit; max-width:190px;
}

.group{margin-top:30px}
.group-label{
  display:flex; align-items:center; gap:12px;
  font-size:12.5px; color:var(--faint); margin:0 0 10px; letter-spacing:.01em;
}
.group-label::after{content:""; flex:1; height:1px; background:var(--line)}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:8px; overflow:hidden;
}
.card.open{border-color:var(--ink)}
.row{display:flex; align-items:center; gap:12px; padding:12px 14px}
.num{font-size:12.5px; color:var(--faint); min-width:28px; font-variant-numeric:tabular-nums}
.topic{flex:1; font-size:15px; font-weight:500; min-width:0; color:var(--soft)}

.speak{
  flex:0 0 auto; width:42px; height:42px; border-radius:50%; cursor:pointer;
  border:none; background:var(--audio-bg); color:var(--audio);
  display:grid; place-items:center; font-family:inherit;
}
.speak svg{width:20px; height:20px; fill:currentColor}
.speak.on{background:var(--audio); color:var(--card)}
.speak.on::after{
  content:""; position:absolute; width:42px; height:42px; border-radius:50%;
  border:2px solid var(--audio); animation:ring 1.3s ease-out infinite;
}
.speak-wrap{position:relative; display:grid; place-items:center; flex:0 0 auto}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.55);opacity:0}}
@media (prefers-reduced-motion:reduce){.speak.on::after{animation:none; opacity:.4}}

.toggle{
  flex:0 0 auto; width:32px; height:32px; border:none; background:none; cursor:pointer;
  color:var(--faint); display:grid; place-items:center;
}
.toggle svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; transition:transform .18s ease}
.card.open .toggle svg{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.toggle svg{transition:none}}

.panel{display:none; padding:2px 14px 16px; border-top:1px solid var(--line)}
.card.open .panel{display:block}
.en{font-family:"Newsreader",Georgia,serif; font-size:17px; line-height:1.6; margin:14px 0 0}
.tagline{display:flex; align-items:center; gap:8px; margin:20px 0 6px}
.tagline span:first-child{font-size:12.5px; color:var(--faint)}
.badge{font-size:11.5px; padding:2px 9px; border-radius:999px; font-weight:500}
.badge.keep{background:var(--keep-bg); color:var(--keep)}
.badge.adapt{background:var(--adapt-bg); color:var(--adapt)}
.ans{font-family:"Newsreader",Georgia,serif; font-size:16.5px; line-height:1.8; color:var(--soft); margin:0}
.qlabel{font-size:12.5px; color:var(--faint); margin:14px 0 0}

.tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:18px}
.btn{
  border:1px solid var(--line); background:none; color:var(--soft); border-radius:999px;
  padding:7px 14px; font-size:13.5px; font-family:inherit; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{border-color:var(--soft)}
.btn.rec{color:var(--rec); border-color:var(--rec)}
.btn.rec.active{background:var(--rec-bg)}
.dot{width:8px; height:8px; border-radius:50%; background:currentColor}
.btn.rec.active .dot{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.btn.rec.active .dot{animation:none}}
audio{width:100%; margin-top:12px; height:38px}
.note{font-size:12.5px; color:var(--faint); margin:10px 0 0}

button:focus-visible,select:focus-visible{outline:2px solid var(--audio); outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>OPIc 3-3 연습</h1>
  <p class="sub">질문을 듣고 2분 동안 답한 뒤, 펼쳐서 모범답안과 비교하세요.</p>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <select id="rate" aria-label="읽기 속도">
      <option value="0.65">아주 느리게</option>
      <option value="0.8">느리게</option>
      <option value="0.9">조금 느리게</option>
      <option value="1">보통</option>
    </select>
    <select id="voice" aria-label="읽어주는 목소리"></select>
  </div>
</header>

<main id="list"></main>

<p class="note" id="foot"></p>

</div>

<script>
const DATA = [{"no": 1, "title": "모의고사 1회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. I like to watch movies, especially musical movies. Also, I go to the park near my house for a walk almost every day. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "좋아하는 영화 장르 (WHAT)", "src": "응용", "q": "You indicated in the survey that you like to watch movies. What kinds of movies do you like? Why do you like them?", "a": "I like musical movies the most. They are so energetic and entertaining that I can relieve stress. Because I'm busy with work, I feel so tired when I get home. In order to get over it, I usually watch a musical movie on weekends. The songs are so beautiful that I sing along with them. Also, I like action movies. They are exciting, so I can forget about my work. I usually watch movies at home with my family. I believe this is a great way to enjoy my free time."}, {"n": 3, "tag": "영화 보러 가는 날의 일과 (WHAT)", "src": "응용", "q": "Tell me about what you usually do when you go to see a movie. Who do you go with? What do you do before and after the movie?", "a": "I usually go to the movies with my best friend once a month. There is a big theater downtown. It takes about forty minutes by subway from my house. Before the movie, we have dinner at a restaurant nearby. Then, we buy popcorn and drinks at the theater. After the movie, we go to a coffee shop and talk about the story and the actors. Since we are so busy, we can't hang out often. So, it is a great chance to catch up with each other. I believe this is a great way to enjoy my weekend."}, {"n": 4, "tag": "최근에 본 영화 (최근 경험)", "src": "응용", "q": "Tell me about the last movie you saw. What was it about? Who did you see it with? How did you feel about it?", "a": "Two weeks ago, I went to see a musical movie with my brother. It was about a young singer who wanted to become a star. The theater was so popular that there were many people. The songs were so energetic and the actors were great. I sang along with the songs in my mind. After the movie, we had dinner at a restaurant near the theater. We talked about our favorite scenes. Overall, it was a great time with my brother, and I want to watch it again."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "자주 가는 공원 (WHERE)", "src": "응용", "q": "You indicated that you like to go to parks. Tell me about a park you often go to. Where is it? What does it look like?", "a": "I'd like to talk about Lake park. It is just five minutes away from my house, so I can easily go there. As the name says, it has a huge lake at the center. Around it, there are good walking paths. There are also many trees and benches, so I can enjoy the beauty of nature. Plus, there is a small coffee shop near the entrance. The park is so popular that there are always many people working out there. That makes me feel safe. For these reasons, I like the park the most."}, {"n": 6, "tag": "공원에서 하는 일 (WHAT)", "src": "그대로", "q": "What do you usually do at the park? Who do you go with? Tell me about a usual day at the park.", "a": "When I have free time, I try to do something fun. Usually, I go to a park near my house. There is a big lake at the center and around it, there are good walking paths. I always walk on the track for an hour. Then I feel refreshed. After the walk, I watch movies on my smartphone on a bench. They are so energetic and entertaining that I can relieve stress. On weekends, my friend sometimes joins me. I believe these are great ways to enjoy my time at the park."}, {"n": 7, "tag": "공원에서 기억에 남는 일 (에피소드)", "src": "그대로", "q": "Tell me about a memorable experience you had at a park. What happened? Why was it memorable?", "a": "Two weeks ago, I went to a park near my house for a walk with my friend. Usually, the park was quiet, so we wanted to catch up with each other. However, at that time, I found a lot of people looking at something. As I came close to them, I could see a famous actor filming there. Even though he was wearing casual clothes, he looked so fabulous. It was my first time to see an actor in person. So, I waited for his break time. Luckily, I could take a picture with him. Since then, when I watch him on TV, the good memory makes me smile."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "우리나라의 재활용 (HOW)", "src": "응용", "q": "Tell me about recycling in your country. What kinds of things do people recycle? How do they recycle?", "a": "In my country, people recycle a lot. We sort the trash into different groups. For example, we separate paper, plastic, cans, and glass bottles. Food waste goes into a special bag. In my apartment, there is a recycling area in the parking lot. We can take out the recycling on certain days, usually once a week. If we don't follow the rules, we have to pay a fine. So, everyone tries to do it right. I think it's a good system to protect the environment."}, {"n": 9, "tag": "집에서 재활용하는 방법 (WHAT)", "src": "응용", "q": "Tell me about how you recycle at home. Who does the recycling? How often do you take it out?", "a": "At home, my family does the recycling together. We have some boxes in the kitchen for paper, plastic, and cans. Before we put the plastic in the box, we wash it with water. My father usually takes out the recycling on Sunday evening. When he is busy, my brother and I do it. It takes about ten minutes. It's a little annoying, but it's not difficult. I believe recycling is a small thing that everyone can do for the environment."}, {"n": 10, "tag": "재활용하다 생긴 일 (에피소드)", "src": "응용", "q": "Tell me about a memorable experience you had while recycling. What happened?", "a": "Last month, something funny happened while I was recycling. I was in a hurry, so I took out the recycling quickly. When I came back home, I couldn't find my wallet. I looked for it everywhere, but I couldn't find it. Then, I remembered that I put a paper bag in the recycling box. So, I ran to the recycling area. Luckily, my wallet was in the paper bag. That made me so relieved. Since then, I always check the bags before I take them out."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "전화로 문의하기 — 영화관", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. You want to see a movie with your friend this weekend. Call the movie theater and ask three or four questions about the movie and the tickets.", "a": "Hello, I'm calling to get some information about a movie this weekend. I'm planning to see a movie with my friend, so I want to ask you a few questions. First of all, what movies are playing this Saturday? Is there a musical movie? Also, what time does it start? I prefer the evening. And how much are the tickets? Is there a discount for members? Lastly, can I book the tickets online? These are all of my questions. Thanks for your help."}, {"n": 12, "tag": "문제상황 — 예매한 표의 날짜가 틀림", "src": "응용", "q": "I'm sorry, but there is a problem I need you to resolve. You booked two movie tickets for tonight, but the tickets you got are for the wrong date. Call the theater, explain the situation, and give two or three alternatives.", "a": "Hello, this is Sung-hwan. There seems to be a problem with my tickets. The thing is that I booked two tickets for tonight's movie, but the tickets say next Friday. To deal with the problem, here are some suggestions I can come up with. First of all, could you change my tickets to tonight? If not possible, how about giving me tickets for tomorrow night? If not, I'll just cancel them and get a full refund. If you have another idea, feel free to let me know. I want you to get back to me as soon as possible. Bye!"}, {"n": 13, "tag": "관련 경험 — 예약 문제", "src": "응용", "q": "That's the end of the situation. Have you ever had a problem with a reservation? What happened, and how did you deal with it?", "a": "I had a similar experience in the past. A few months ago, I booked a table at a restaurant for my mother's birthday. When we arrived, I had a problem because they couldn't find my reservation. That made me completely panic. In order to deal with the problem, I showed them the booking message on my phone. The staff said sorry and found us a table. Eventually, we had to wait for twenty minutes. From this experience, I learned to call and check my reservation the day before. Since then, I've never made the same mistake."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "우리나라의 계절과 날씨 (WHAT)", "src": "응용", "q": "Tell me about the weather in your country. What are the seasons like? Which season do you like the most?", "a": "In my country, there are four seasons. In spring, it's warm and there are many flowers. In summer, it's very hot and humid, and it rains a lot. In fall, it's cool and the leaves turn red and yellow. In winter, it's cold and it sometimes snows. My favorite season is fall. The weather is so nice that I can go for a walk every day. Also, the park near my house is so beautiful in fall. For these reasons, I like fall the most."}, {"n": 15, "tag": "면접관에게 질문하기 — 날씨", "src": "응용", "q": "The weather in my country is different from yours. Please ask me three or four questions about the weather where I live.", "a": "Hello, you said that the weather in your country is different from mine. I'd like to ask you a few questions about it. First, how many seasons are there in your country? Also, what is the weather like in summer? Is it hot and humid like Korea? And does it snow in winter? Finally, which season do you like the most? Why do you like it? These are all of my questions. Thank you for listening to them. I hope you have a good day, bye!"}]}]}, {"no": 2, "title": "모의고사 2회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. I love listening to music, so I always have my earphones with me. Also, I like to go to the beach with my friends in summer. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "좋아하는 음악과 가수 (WHO)", "src": "응용", "q": "You indicated that you enjoy listening to music. What kind of music do you like? Who is your favorite singer?", "a": "I like K-pop and musical songs the most. My favorite singer is IU. She is a famous Korean singer and actress. Her voice is so beautiful that I can relax when I listen to her songs. Also, her songs have nice words, so they cheer me up. I listen to her music almost every day. When I'm tired after work, her songs make me feel better. For these reasons, she is my favorite singer."}, {"n": 3, "tag": "음악 듣는 방법 (HOW)", "src": "응용", "q": "When and where do you usually listen to music? How do you listen to it?", "a": "I usually listen to music on my smartphone. I use a music app, so I can listen to any song I want. I listen to music on the bus every morning. It takes about an hour to get to work, so music makes the time go fast. I always use my wireless earphones. Also, I listen to music when I go for a walk at the park. At home, I play music on a speaker when I clean my room. I believe music is a great way to enjoy my day."}, {"n": 4, "tag": "음악에 관심을 갖게 된 계기 (처음 경험)", "src": "응용", "q": "How did you first get interested in music? When was it? Tell me the story.", "a": "I got interested in music when I was in middle school. My older cousin gave me an old MP3 player for my birthday. There were many K-pop songs in it. I listened to them every day on my way to school. My favorite song was so exciting that I listened to it over and over. After that, I started to buy CDs with my pocket money. I also went to karaoke with my friends every weekend. Since then, music has been a big part of my life."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "좋아하는 해변 (WHERE)", "src": "응용", "q": "You indicated that you like to go to the beach. Tell me about a beach you like to go to. Where is it? What does it look like?", "a": "I'd like to talk about Haeundae Beach in Busan. There are many reasons why I like it. First of all, it is easy to get there. It takes about two and a half hours by KTX from Seoul. Also, the beach is so long and the sand is so soft. There are many hotels and restaurants along the beach. Plus, there is a big traditional market nearby. It's famous for fresh seafood. It's so fresh and even cheap. For these reasons, I like the beach the most."}, {"n": 6, "tag": "해변에서 하는 일 (WHAT)", "src": "응용", "q": "What do you usually do when you go to the beach? Who do you go with?", "a": "When I go to the beach, I usually go with my friends. First, we spread out a mat on the sand. Then, we take a walk along the beach. The sound of the waves makes me relaxed. In the afternoon, we swim in the sea or play beach volleyball. In the evening, we eat seafood at a restaurant near the beach. Sometimes, we watch the fireworks at night. I believe these are great ways to enjoy my time at the beach."}, {"n": 7, "tag": "최근에 다녀온 해변 (최근 경험)", "src": "그대로", "q": "Tell me about the last time you went to the beach. Who did you go with? What did you do there?", "a": "During the recent holidays, I visited Haeundae Beach to celebrate my best friend's birthday. First, we went to the beach. It was so beautiful that there were many people. I spread out a mat in our spot and ordered in some food from a local restaurant. Also, there was a big traditional market nearby, so some of us went there to buy more food and drinks for our party. Since we were so busy, we couldn't hang out often. So, it was a great chance to catch up with one another. All of us had a lot of fun and we took a lot of pictures. Overall, it was a great time with old friends."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "내가 사는 집 (WHERE)", "src": "응용", "q": "Tell me about the place where you live. What does your home look like? How many rooms are there?", "a": "I live with my family in an apartment in the city of Suwon. It is on the tenth floor, so we have a nice view. There are three bedrooms, two bathrooms, a kitchen, and a living room. When you come inside, you can see the living room first. There is a big sofa and a TV there. The kitchen is next to the living room, and there is a table with four chairs. My room is small, but it's cozy. My favorite part is the living room, because my family spends time together there."}, {"n": 9, "tag": "집에서 하는 일 (WHAT)", "src": "응용", "q": "What do you usually do at home? Tell me about a typical day at home.", "a": "When I'm at home, I try to relax. Because I'm busy with work, I feel so tired when I get home. In order to get over it, I take a shower first. Then, I have dinner with my family in the kitchen. After dinner, I watch TV with my family in the living room. Later, I go to my room and listen to music. On weekends, I sleep late and clean my room. I believe these are great ways to enjoy my time at home."}, {"n": 10, "tag": "집에서 있었던 기억에 남는 일 (에피소드)", "src": "응용", "q": "Tell me about something memorable that happened at your home. What happened? Why was it memorable?", "a": "Last summer, something unexpected happened at my home. It was a very hot evening, and suddenly the power went out. The air conditioner and the lights stopped working. At first, my family was so surprised. We found some candles in the kitchen and lit them. Then, we sat in the living room and talked for a long time. We usually watch TV, so we don't talk much. The power came back after two hours. It was a little uncomfortable, but it was a special night for my family."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "전화로 문의하기 — 해변 근처 호텔", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. You want to go to the beach with your friends this weekend. Call a hotel near the beach and ask three or four questions about staying there.", "a": "Hello, I'm calling to get some information about rooms for this weekend. I'm planning to go to the beach with my friends, so I want to ask you a few questions. First of all, are there any available rooms this Saturday? We are four people, so we need a big room. Also, how much is it per night? Is breakfast included? And how far is the hotel from the beach? Can we walk there? Lastly, is there a parking lot? These are all of my questions. Thanks for your help."}, {"n": 12, "tag": "문제상황 — 갑자기 출근하게 됨", "src": "응용", "q": "I'm sorry, but there is a problem I need you to resolve. On the day of the trip, you suddenly have to work. Call your friend, explain the situation, and give two or three alternatives.", "a": "Hi, it's me, Sung-hwan. I'm sorry, but there seems to be a problem with our trip. The thing is that my boss just called me, and I have to work this Saturday. To deal with the problem, here are some suggestions I can come up with. First of all, how about going to the beach next weekend? If not possible, could you go with our friends first? I'll join you on Sunday morning. If not, I'll pay for the hotel cancellation fee. If you have another idea, feel free to let me know. I'm so sorry again. Bye!"}, {"n": 13, "tag": "관련 경험 — 계획이 바뀐 일", "src": "응용", "q": "That's the end of the situation. Have you ever had to change your plans because of something unexpected? Tell me what happened and how you dealt with it.", "a": "I had a similar experience in the past. Last year, I planned a trip to Jeju Island with my family. But two days before the trip, I had a problem because a big typhoon was coming. That made me completely disappointed. In order to deal with the problem, I called the airline and the hotel. Luckily, I could change the dates without paying extra money. Eventually, we went to Jeju Island two weeks later, and the weather was perfect. From this experience, I learned to check the weather forecast before I book a trip. Since then, I've never made the same mistake."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "우리나라의 대중교통 (WHAT)", "src": "응용", "q": "Tell me about the public transportation in your country. What kinds of transportation do people use?", "a": "In my country, people use many kinds of public transportation. There are buses, subways, taxis, and trains. In big cities like Seoul, the subway is the most popular. It's cheap and always on time. Also, the buses go to every part of the city. We use a transportation card, so we can pay easily. If we want to travel far, we take the KTX. It's very fast and comfortable. I think public transportation in my country is very convenient."}, {"n": 15, "tag": "면접관에게 질문하기 — 교통", "src": "응용", "q": "I also use public transportation every day. Please ask me three or four questions about how I get around.", "a": "Hello, you said that you also use public transportation every day. I'd like to ask you a few questions about it. First, what kind of transportation do you usually use? Do you take the bus or the subway? Also, how long does it take to get to work? And how much does it cost? Is it expensive in your city? Finally, do you like public transportation in your country? These are all of my questions. Thank you for listening to them. I hope you have a good day, bye!"}]}]}, {"no": 3, "title": "모의고사 3회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. I like to go to see musicals and plays. Also, I go jogging at a park near my house three times a week. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "좋아하는 공연 (WHAT)", "src": "응용", "q": "You indicated in your background survey that you like to go to see performances. What kinds of performances do you like to see? Where do you go, and who do you usually go with?", "a": "When I have free time, I try to do something fun. Usually, I go to see musicals. They are so energetic and entertaining that I can relieve stress. There is a big theater downtown. It takes about forty minutes by subway from my house. I usually go there with my best friend once a month. Before the show, we have dinner at a restaurant nearby. After the show, we talk about the songs and the actors. That is good for my mental health. I believe these are great ways to enjoy my free time."}, {"n": 3, "tag": "자주 가는 공연장 (WHERE)", "src": "응용", "q": "Tell me about a theater or concert hall you often go to. Where is it? What does it look like?", "a": "The theater I often go to is in downtown Seoul. It is near a subway station, so it's easy to get there. When seen from the outside, it looks new and modern. When you come inside, you can see a big lobby with a ticket counter. There is also a small coffee shop and a gift shop. The hall is so big that there are about a thousand seats. The stage is wide and the lights are so colorful. My favorite part is the sound. It's so clear that I feel like I'm in the show."}, {"n": 4, "tag": "처음 본 공연 (처음 경험)", "src": "응용", "q": "When did you first go to see a performance? What was it? Who were you with? How did you feel about it?", "a": "I first went to see a performance when I was in high school. It was a musical. My mother bought the tickets for my birthday. The theater was in Seoul, so it took about two hours by bus. When I went inside, I was surprised because it was so big. The stage was so colorful and the songs were so beautiful. I couldn't take my eyes off the stage. After the show, I bought a CD of the songs. I listened to it every day. Since then, I've become a fan of musicals."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "조깅하는 시간과 장소 (WHAT)", "src": "응용", "q": "In your background survey, you indicated that you go jogging. How often do you go? Where do you go? Who do you go with?", "a": "I go jogging three times a week after work. I usually go to a park near my house. There is a big lake at the center and around it, there are good jogging tracks. I run on the track for about thirty minutes. I usually go alone, because I like to listen to music while I'm running. On weekends, my friend sometimes joins me. After jogging, we sit on a bench and talk. Then I feel refreshed. I believe jogging is a great way to stay healthy."}, {"n": 6, "tag": "조깅을 시작한 계기 (처음 경험)", "src": "그대로", "q": "How did you first become interested in jogging? When was it? Why did you start running?", "a": "I got interested in jogging, because I gained weight last year. I stopped eating snacks and started jogging at a park near my house. The park I go to is called Lake park. It is just five minutes away from my house, so I can easily go there. Also, it has a huge lake at the center, and around it there are several good jogging tracks. Plus, jogging doesn't need a lesson or special equipment. All I need is a pair of sneakers and comfortable clothes. In addition, the park is so popular that there are always many people working out there. So, I feel safe and want to do more. Now, I keep jogging after work to stay healthy."}, {"n": 7, "tag": "부상 예방을 위해 하는 일 (WHICH)", "src": "그대로", "q": "There must be a certain amount of risk of getting injured while jogging. What items do you use or wear? And what do you do to avoid injuries?", "a": "I go jogging because it helps me stay healthy, so in order to keep doing it, I always do a few things to avoid injuries. First of all, I warm up by stretching my muscles. Then I can prevent pulled muscles. In addition, I always wear running shoes that fit well, because I don't want to have blisters. Lastly, I drink plenty of water while jogging. With these things, I think I can avoid possible injuries. Thus, I try to do them before jogging."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "우리나라의 모임과 축하 (WHAT)", "src": "응용", "q": "Tell me about gatherings or celebrations in your country. What do people do when they get together?", "a": "In my country, people get together on special days like birthdays and holidays. On birthdays, we usually have dinner at a restaurant with family or friends. We eat a birthday cake and sing a birthday song. On big holidays like Chuseok, families get together at their parents' house. We cook traditional food and eat together. After dinner, we talk and play games. Young people often go to a cafe or karaoke after dinner. I believe these are usual ways to enjoy our time together."}, {"n": 9, "tag": "최근에 간 모임 (최근 경험)", "src": "그대로", "q": "Tell me about the last gathering you went to. Who was there? What did you do?", "a": "Two weeks ago, on my best friend's birthday, I visited a park near my house with my friends. First, we went to a lake at the center. It was so beautiful that there were many people. I spread out a mat in our spot and ordered in some food from a local restaurant. Also, there was a big traditional market nearby, so some of us went there to buy more food and drinks for our party. Since we were so busy, we couldn't hang out often. So, it was a great chance to catch up with one another. All of us had a lot of fun and we took a lot of pictures together. Overall, it was a great time with old friends."}, {"n": 10, "tag": "모임을 준비하는 방법 (HOW)", "src": "응용", "q": "When you have a party or a gathering at home, what do you do to prepare for it?", "a": "When I have a party at home, I always do a few things. First of all, I clean the living room and move the table to the center. In addition, I make a list of the food and drinks. Then, I go to a big traditional market near my house to buy them. Sometimes, I order in some food from a local restaurant. Lastly, I prepare some music for the party. With these things, everyone can have a good time. Thus, I always try to prepare early."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "전화로 문의하기 — 가구점", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. You want to buy a new sofa for your living room. Call the furniture store and ask three or four questions about the sofa you want to buy.", "a": "Hello, I'm calling to get some information about a sofa. I'm planning to buy a new one for my living room, so I want to ask you a few questions. First of all, do you have a three-seat sofa? What colors are available? Also, how much is it? Are there any promotions going on? And how long does delivery take? Is delivery free? Lastly, can I return it if I don't like it? These are all of my questions. Thanks for your help."}, {"n": 12, "tag": "문제상황 — 배송 받은 가구에 문제", "src": "그대로", "q": "I'm sorry, but there is a problem I need you to resolve. You have received the furniture you bought, but there is something wrong with it. Call the furniture store, explain the situation, and ask for a way to get an exchange or your money back.", "a": "Hello, this is Sung-hwan. There seems to be a problem with the furniture. The thing is that I received the sofa yesterday, but there is something wrong with it. To deal with the problem, here are some suggestions I can come up with. First of all, could you send somebody to pick it up for exchange? If not possible, how about giving me a 30% discount on my next purchase? If not, I'll just refund it. If you have another idea, feel free to let me know. I want you to get back to me as soon as possible. Bye!"}, {"n": 13, "tag": "관련 경험 — 주문한 물건이 마음에 안 듦", "src": "그대로", "q": "That's the end of the situation. Have you ever ordered something and were not satisfied with it? Tell me what the problem was and how you dealt with it.", "a": "I had a similar experience in the past. A few months ago, I needed to buy a sweater, so I shopped online. When I found something I wanted, I had a problem because I wasn't sure which size would be good for me. The product description didn't say clearly about it. However, I decided to order my usual size. Unfortunately, when the item arrived, it was different from what I thought. That made me completely disappointed. In order to deal with the problem, I had to return it for a refund. Eventually, I went to a store to buy another one. From this experience, I learned to check an item before buying it. Since then, I've never made the same mistake."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "우리 동네 도서관 (WHERE)", "src": "응용", "q": "Tell me about a library in your area. Where is it? What does it look like? What can people do there?", "a": "There is a public library near my house. It takes about ten minutes on foot. When seen from the outside, it looks old, but it's well-maintained. When you come inside, you can see a big front desk. On the first floor, there are many books and magazines. On the second floor, there is a quiet reading room with long tables. There are also some computers that people can use for free. My favorite part is the reading room, because it's so quiet that I can focus. That makes me feel comfortable."}, {"n": 15, "tag": "면접관에게 질문하기 — 도서관", "src": "응용", "q": "I also go to the library sometimes. Please ask me three or four questions about the library I go to.", "a": "Hello, you said that you also go to the library sometimes. I'd like to ask you a few questions about it. First, where is the library? Is it near your house? Also, how often do you go there? And what do you usually do there? Do you read books or study? Finally, what do you like about the library? Is it quiet? These are all of my questions. Thank you for listening to them. I hope you have a good day, bye!"}]}]}, {"no": 4, "title": "모의고사 4회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. I like to go on trips in Korea with my friends. Also, I go to the park nearby for a walk every day. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "좋아하는 국내 여행지 (WHERE)", "src": "응용", "q": "You indicated that you like to go on trips domestically. Tell me about a place you like to visit. Why do you like it? Describe it in detail.", "a": "I'd like to talk about Gangneung. There are many reasons why I like it the most. First of all, it is not far from where I live. It takes about two hours by KTX. Also, it has a beautiful beach, so when I relax there, I can enjoy the beauty of nature. Plus, there is a traditional market nearby. It's famous for fresh local food. It's so fresh and even cheap. Thus, when I'm there, I always have fun and I can meet friendly local people. For these reasons, I like the place the most."}, {"n": 3, "tag": "여행 전에 하는 준비 (HOW)", "src": "응용", "q": "What do you usually do to prepare for a trip in Korea? What do you take with you?", "a": "Before I go on a trip, I always do a few things. First of all, I decide where to go with my friends. In addition, I book a hotel and the KTX tickets online. I usually do it a month before the trip, because it is cheaper. Then, I check the weather of the city. Lastly, I pack a small bag. I always bring comfortable shoes, a phone charger, and some snacks. With these things, I can enjoy my trip without problems."}, {"n": 4, "tag": "여행 중 기억에 남는 일 (에피소드)", "src": "응용", "q": "Tell me about a memorable incident that happened while you were traveling in Korea. What happened, and why was it memorable?", "a": "Last spring, I went on a trip to Gyeongju with my friend. On the second day, we wanted to visit a famous temple. But we took the wrong bus, so we got lost. My phone battery was almost dead, so I couldn't check the map. At that time, an old man came up to us and asked if we needed help. He told us the way and even walked with us to the bus stop. He was so kind that we were really touched. Luckily, we could get to the temple before it closed. Since then, when I see tourists on the street, I try to help them."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "걷기를 하는 곳과 방법 (WHAT)", "src": "그대로", "q": "In your background survey, you indicated that you like to go for a walk. How often do you go? Where do you like to go? Who do you usually go with?", "a": "When I have free time, I try to do something fun. Usually, I go to a park near my house. There is a big lake at the center and around it, there are good walking paths. I always walk on the track for an hour. Then I feel refreshed. After the walk, I watch movies on the smartphone on a bench. They are so energetic and entertaining that I can relieve stress. I believe these are great ways to enjoy my time at the park."}, {"n": 6, "tag": "걷기를 시작한 계기 (처음 경험)", "src": "그대로", "q": "How did you first become interested in walking? When was it? Why did you start walking?", "a": "I got interested in walking, because I gained weight last year. I stopped eating snacks and started walking at a park near my house. The park I go to is called Lake park. It is just five minutes away from my house, so I can easily go there. Also, it has a huge lake at the center, and around it there are several good walking tracks. I usually walk on the tracks. In addition, the park is so popular that there are always many people working out there. So, I feel safe and want to do more. Now, I keep walking after work to stay healthy."}, {"n": 7, "tag": "걷다가 생긴 일 (에피소드)", "src": "응용", "q": "Tell me about a memorable experience you had while you were walking. What happened?", "a": "Last month, I went for a walk at the park after dinner. The weather was nice, so I didn't bring an umbrella. But in the middle of the walk, it suddenly started to rain heavily. I ran to a small coffee shop near the entrance. It was full of people who were also caught in the rain. I ordered a hot chocolate and waited. There, I met my old friend from high school by chance. We hadn't seen each other for five years. So, we talked for an hour until the rain stopped. Since then, we walk together every weekend."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "우리나라의 은행 (WHERE)", "src": "응용", "q": "Tell me about the banks in your country. Where are they located? What do they look like?", "a": "The banks in my country are usually located downtown. There is almost always one near a subway station. When seen from the outside, they look new and modern. When you come inside, you can see a long counter at the center. Around it, there are seating areas. There is a ticket machine by the entrance, so you can take a number and wait. There are also several ATMs. The staff are so friendly that they always smile. That makes me feel comfortable."}, {"n": 9, "tag": "은행 업무를 보는 방법 (WHAT)", "src": "응용", "q": "Tell me what you usually do at a bank. How often do you go there?", "a": "To be honest, I don't go to a bank often. Most of my banking happens on my phone. I check my balance and send money with a banking app. It's so fast and easy. But sometimes, I have to go to a bank. Last month, I went there to make a new card. I took a number from the ticket machine and waited for about ten minutes. The staff helped me kindly. I think banking is so convenient these days."}, {"n": 10, "tag": "은행에서 있었던 일 (에피소드)", "src": "응용", "q": "Tell me about a memorable experience you had at a bank. What happened?", "a": "A few months ago, I had a problem at an ATM. I wanted to withdraw some money for my friend's birthday party. But after I put in my card, the machine stopped working. My card didn't come out. That made me completely panic. There was a phone next to the ATM, so I called the bank. The staff told me to come back the next morning. So, I went to the bank the next day and got my card back. Since then, I always use the ATM inside the bank during business hours."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "직접 문의하기 — 프런트에서 숙박 문의", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. You are on a trip, and you want to stay at a hotel tonight, but you didn't make a reservation. Go to the front desk and ask three or four questions.", "a": "Hello, I'm here to get some information about rooms for tonight. I didn't make a reservation, so I want to ask you a few questions. First of all, are there any available rooms tonight? I'm traveling alone, so a single room is enough. Also, how much is it? Is breakfast included? And what time is check-out? Lastly, can I pay by credit card? These are all of my questions. Thanks for your help."}, {"n": 12, "tag": "문제상황 — 방의 에어컨이 고장", "src": "응용", "q": "I'm sorry, but there is a problem I need you to resolve. When you get into your room, the air conditioner doesn't work. Call the front desk, explain the situation, and give two or three alternatives.", "a": "Hello, this is Sung-hwan in room 805. There seems to be a problem with my room. The thing is that the air conditioner doesn't work, and it's too hot to sleep. To deal with the problem, here are some suggestions I can come up with. First of all, could you send somebody to fix it now? If not possible, how about giving me another room? If not, I'd like to get a discount for tonight. If you have another idea, feel free to let me know. I want you to get back to me as soon as possible. Bye!"}, {"n": 13, "tag": "관련 경험 — 숙소 예약 문제", "src": "응용", "q": "That's the end of the situation. Have you ever had a problem with a hotel? What happened, and how did you deal with it?", "a": "I had a similar experience in the past. A few years ago, I went on a trip to Busan with my friends. When we arrived at the hotel, I had a problem because they couldn't find my reservation. That made me completely panic. It was late at night and I was so tired. In order to deal with the problem, I showed them the booking email on my phone. Luckily, they found my name with the email. Eventually, we could check in after thirty minutes. From this experience, I learned to print out my booking before a trip. Since then, I've never made the same mistake."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "우리나라의 휴일 (WHAT)", "src": "응용", "q": "Tell me about holidays in your country. What are the major holidays? What do people do on those days?", "a": "In my country, there are many holidays. The biggest ones are Seollal and Chuseok. Seollal is the Lunar New Year, and Chuseok is like Thanksgiving. On these holidays, families get together at their parents' house. We eat traditional food like rice cake soup and songpyeon. Children bow to their parents and get some money. Also, there are other holidays like Children's Day and Christmas. On these days, people go out with their family or friends. I think holidays are a great chance to spend time with family."}, {"n": 15, "tag": "면접관에게 질문하기 — 휴일", "src": "응용", "q": "There are holidays in my country, too. Please ask me three or four questions about the holidays in my country.", "a": "Hello, you said that there are holidays in your country, too. I'd like to ask you a few questions about it. First, what is the biggest holiday in your country? When is it? Also, what do people do on that day? Do families get together? And what kind of food do people eat? Finally, what is your favorite holiday? Why do you like it? These are all of my questions. Thank you for listening to them. I hope you have a good day, bye!"}]}]}, {"no": 5, "title": "모의고사 5회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. I like to go to K-pop concerts with my best friend. Also, when I have a long vacation, I usually stay home and rest. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "좋아하는 콘서트 (WHAT)", "src": "응용", "q": "You indicated that you like to go to concerts. What kinds of concerts do you like? Who do you usually go with?", "a": "I like K-pop concerts the most. They are so energetic and exciting that I can relieve stress. I usually go to concerts two or three times a year. I go with my best friend, because she likes the same singers. Before the concert, we buy some snacks and a light stick. During the concert, we sing and dance together. After the concert, we have a late dinner and talk about it. I believe these are great ways to enjoy my free time."}, {"n": 3, "tag": "자주 가는 콘서트장 (WHERE)", "src": "응용", "q": "Tell me about a concert hall you often go to. Where is it? What does it look like?", "a": "The concert hall I often go to is in the Olympic Park in Seoul. It takes about an hour by subway from my house. When seen from the outside, it looks round and modern. Around it, there is a big park with many trees. When you come inside, you can see a huge stage at the center. There are thousands of seats around it. The lights and the screens are so big that everyone can see the singer well. My favorite part is the sound. It's so loud and clear that I feel excited."}, {"n": 4, "tag": "기억에 남는 콘서트 (에피소드)", "src": "응용", "q": "Tell me about the most memorable concert you have been to. What happened? Why was it memorable?", "a": "Last summer, I went to an outdoor concert with my friend. It was my favorite singer's concert, so I was so excited. But in the middle of the concert, it suddenly started to rain. Everyone got wet, but nobody left. The singer came to the front of the stage and sang in the rain with us. Everyone sang along together. It was so touching that I almost cried. After the concert, we were all wet, but we were so happy. That's why that concert is unforgettable to me."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "휴가 때 집에서 하는 일 (WHAT)", "src": "응용", "q": "You indicated in your background survey that you like to stay home for vacation. What kinds of activities do you do at home during your vacation?", "a": "When I have a vacation, I usually stay home. Because I'm busy with work, I feel so tired. So, the first thing I do is sleep as much as I want. In order to get over the tiredness, I watch musical movies at home. They are so energetic and entertaining that I can relieve stress. Besides, I go to the park nearby for a walk every day. In the evening, I cook something special for my family. I believe these are great ways to enjoy my vacation."}, {"n": 6, "tag": "휴가 때 만나는 사람 (WHO)", "src": "응용", "q": "Who do you usually meet during your vacation at home? What do you do together?", "a": "During my vacation, I usually meet my close friends. We have known each other since high school. Because we are so busy, we can't hang out often. So, I invite them to my home. We order in some food and watch movies together. Sometimes, we play board games in the living room. We talk and laugh until late at night. It's a great chance to catch up with one another. I believe spending time with old friends is the best part of my vacation."}, {"n": 7, "tag": "최근에 집에서 보낸 휴가 (최근 경험)", "src": "응용", "q": "Tell me about the last vacation you spent at home. What did you do? Who was with you?", "a": "During my last vacation, I stayed at home for five days. On the first day, I slept until noon. Then, I cleaned my room and organized my closet. On the second day, my friends came to my house for my best friend's birthday. We ordered in some food from a local restaurant and had a party. On the other days, I went for a walk at the park and watched movies at home. I didn't go anywhere far, but I felt so relaxed. Overall, it was a great vacation."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "우리나라 사람들의 패션 (WHAT)", "src": "응용", "q": "Tell me about the fashion in your country. What kinds of clothes do people usually wear?", "a": "In my country, people care a lot about fashion. Young people like to wear trendy clothes. For example, they wear oversized T-shirts, jeans, and sneakers. Office workers usually wear shirts and pants to work. These days, many companies let people wear casual clothes. In winter, a long black padded coat is very popular. Also, people often buy clothes online, because it's cheap and easy. I think people in my country dress up well."}, {"n": 9, "tag": "내가 평소에 입는 옷 (WHICH)", "src": "응용", "q": "What kind of clothes do you usually wear? Do you wear different clothes on weekdays and on weekends?", "a": "I usually wear comfortable clothes. On weekdays, I wear a shirt and pants to work. My company doesn't have a strict dress code, so I don't wear a suit. On weekends, I wear a sweatshirt, jeans, and sneakers. When I go for a walk, I wear sweatpants and running shoes. My favorite item is a gray hoodie. It's soft and warm, so I wear it almost every weekend. I think comfortable clothes are the best for me."}, {"n": 10, "tag": "옷을 사는 방법 (HOW)", "src": "응용", "q": "How do you usually shop for clothes? Where do you buy them?", "a": "I usually shop for clothes online. I use a shopping app on my phone. It's so easy that I can buy clothes anytime. Also, there are many sales, so it's cheaper than in the stores. Before I buy something, I read the reviews and check the size. But sometimes, I go to a shopping mall with my friends. I can try on the clothes there. I think shopping is a great way to relieve stress."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "전화로 문의하기 — 온라인 옷가게", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. You want to buy a jacket from an online clothing store. Call the store and ask three or four questions about the jacket.", "a": "Hello, I'm calling to get some information about a jacket. I saw it on your website, so I want to ask you a few questions. First of all, do you have this jacket in black? Also, what sizes are available? How do I know which size is right for me? And how much is it? Is it on sale now? Lastly, can I exchange it if the size doesn't fit? These are all of my questions. Thanks for your help."}, {"n": 12, "tag": "문제상황 — 산 옷의 사이즈가 안 맞음", "src": "응용", "q": "I'm sorry, but there is a problem I need you to resolve. You bought a jacket online, but when it arrived, it was too small. Call the store, explain the situation, and give two or three alternatives.", "a": "Hello, this is Sung-hwan. There seems to be a problem with the jacket I bought. The thing is that I bought it online last week, but it's too small for me. To deal with the problem, here are some suggestions I can come up with. First of all, could you exchange it for a bigger size? If not possible, how about sending me a different jacket at the same price? If not, I'll just return it for a full refund. If you have another idea, feel free to let me know. I want you to get back to me as soon as possible. Bye!"}, {"n": 13, "tag": "관련 경험 — 주문한 물건이 마음에 안 듦", "src": "그대로", "q": "That's the end of the situation. Have you ever bought something that you were not satisfied with? Tell me what the problem was and how you dealt with it.", "a": "I had a similar experience in the past. A few months ago, I needed to buy a sweater, so I shopped online. When I found something I wanted, I had a problem because I wasn't sure which size would be good for me. The product description didn't say clearly about it. However, I decided to order my usual size. Unfortunately, when the item arrived, it was different from what I thought. That made me completely disappointed. In order to deal with the problem, I had to return it for a refund. Eventually, I went to a store to buy another one. From this experience, I learned to check an item before buying it. Since then, I've never made the same mistake."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "음식 배달 서비스 (WHAT)", "src": "응용", "q": "Many people order food for delivery these days. Tell me about food delivery services in your country. What kinds of food do people order? How do they order?", "a": "In my country, food delivery is very popular. People can order almost any kind of food, like chicken, pizza, and Korean food. Most people use a delivery app on their phone. First, they choose a restaurant and the menu. Then, they pay with a credit card in the app. The food usually arrives in about thirty minutes. I order food about once a week, usually chicken on Friday night. It's a little expensive because of the delivery fee, but it's so convenient."}, {"n": 15, "tag": "면접관에게 질문하기 — 음식 배달", "src": "응용", "q": "I also order food for delivery sometimes. Please ask me three or four questions about the food I order.", "a": "Hello, you said that you also order food for delivery sometimes. I'd like to ask you a few questions about it. First, what food do you usually order? Do you like pizza or chicken? Also, how often do you order? And how do you order? Do you use an app or call the restaurant? Finally, how long does it take to arrive? These are all of my questions. Thank you for listening to them. I hope you have a good day, bye!"}]}]}, {"no": 6, "title": "모의고사 6회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. I love traveling abroad, so I go on a trip once a year. Also, I like to watch movies at the theater on weekends. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "좋아하는 나라 (WHERE)", "src": "응용", "q": "You indicated that you like to travel abroad. Tell me about a country you like to visit. Why do you like it? Describe it in as much detail as possible.", "a": "I'd like to talk about Japan. There are many reasons why I like it the most. First of all, it is not far from where I live. It takes about only two hours by plane. Also, it has many beautiful places, so when I relax there, I can enjoy the beauty of nature. Plus, there are many traditional markets. They are famous for fresh local food. It's so fresh and even cheap. Thus, when I'm there, I always have fun and I can meet friendly local people. For these reasons, I like the country the most."}, {"n": 3, "tag": "해외여행 전에 하는 준비 (HOW)", "src": "응용", "q": "What do you usually do before you travel abroad? What do you pack? Tell me about how you prepare for a trip.", "a": "Before I travel abroad, I always do a few things. First of all, I book a flight and a hotel online. I usually do it two months before the trip, because it is cheaper. In addition, I check the weather of the country. Then I can decide which clothes to bring. Next, I pack my bag. I always bring my passport, a credit card, and a phone charger. Lastly, I exchange some money at the bank. With these things, I can enjoy my trip without problems. Thus, I always try to prepare early."}, {"n": 4, "tag": "해외여행 중 기억에 남는 일 (에피소드)", "src": "그대로", "q": "Tell me about a memorable experience you had while traveling abroad. What happened? Why was it memorable to you?", "a": "Last year, while traveling in Japan, I went to a coffee shop near my hotel with my friend. Usually, the coffee shop was quiet, so we wanted to catch up with each other. However, at that time, I found a lot of people looking at something. As I came close to them, I could see a famous Korean singer there. Even though he was wearing casual clothes, he looked so fabulous. It was my first time to see a singer in person. So, I waited for him to finish his coffee. Luckily, I could take a picture with him. Since then, when I listen to his songs, the good memory makes me smile."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "좋아하는 배우 (WHO)", "src": "응용", "q": "Who is your favorite actor or actress? What does that person look like? Why do you like that person?", "a": "My favorite actor is Song Kang-ho. He is a famous Korean actor in his fifties. He has been in many great movies, like Parasite. He looks like an ordinary man, but his acting is so natural. He can make people laugh and cry at the same time. Whenever his new movie comes out, I go to see it at the theater. I think he is the best actor in my country."}, {"n": 6, "tag": "자주 가는 영화관 (WHERE)", "src": "응용", "q": "Tell me about the movie theater you often go to. Where is it? What does it look like?", "a": "The theater I often go to is in a shopping mall near my house. It takes about ten minutes by bus. When you go up to the fifth floor, you can see the ticket machines and a snack bar. There are about ten screens there. The seats are big and comfortable. My favorite part is the snack bar, because the popcorn is so good. Also, there are many restaurants in the mall, so I can eat before the movie. For these reasons, I like the theater the most."}, {"n": 7, "tag": "기억에 남는 영화 (경험)", "src": "응용", "q": "Tell me about the most memorable movie you have seen. When did you see it? Why was it memorable?", "a": "The most memorable movie is a musical movie I saw a few years ago. I saw it at the theater with my family on Christmas. It was about a man who made a big circus show. The songs were so energetic and beautiful that I couldn't take my eyes off the screen. After the movie, my family bought the soundtrack. We listened to it in the car every weekend. Since then, I've become a big fan of musical movies."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "내 휴대폰 (WHICH)", "src": "응용", "q": "Tell me about the phone you use. What does it look like? What do you use it for?", "a": "I use a Samsung Galaxy phone. I bought it about two years ago. It's black and a little big, so I can watch videos well. The camera is so good that I take a lot of pictures with it. I use my phone for many things. In the morning, I check my schedule and the weather. On the bus, I listen to music and watch videos. I also use banking apps and shopping apps. I think I can't live without my phone."}, {"n": 9, "tag": "처음 휴대폰을 가진 경험 (처음 경험)", "src": "응용", "q": "When did you get your first phone? What was it like? How did you feel?", "a": "I got my first phone when I was in middle school. My parents bought it for me, because I started to go to an academy after school. It was a small folder phone. I could only make calls and send text messages. But I was so happy that I took it everywhere. I sent messages to my friends every day. My parents worried, because I used it too much. Since then, I've always had a phone with me."}, {"n": 10, "tag": "휴대폰에 생긴 문제 (에피소드)", "src": "응용", "q": "Have you ever had a problem with your phone? What happened? How did you deal with it?", "a": "Last summer, I had a problem with my phone. I went to the beach with my friends. While I was taking pictures, I dropped my phone into the water. I picked it up quickly, but it didn't turn on. That made me completely panic. All of my pictures were in it. In order to deal with it, I went to a service center the next day. Luckily, they could fix it and save my pictures. Since then, I always use a waterproof case at the beach."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "전화로 문의하기 — 휴대폰 매장", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. You want to buy a new phone. Call the phone store and ask three or four questions about the phone you want.", "a": "Hello, I'm calling to get some information about a new phone. I'm planning to buy a new one, so I want to ask you a few questions. First of all, do you have the newest Galaxy phone? What colors are available? Also, how much is it? Are there any promotions going on? And how long is the warranty? Lastly, can I pay in installments with my credit card? These are all of my questions. Thanks for your help."}, {"n": 12, "tag": "문제상황 — 새로 산 휴대폰 고장", "src": "응용", "q": "I'm sorry, but there is a problem I need you to resolve. The new phone you bought stopped working after a few days. Call the store, explain the situation, and give two or three alternatives.", "a": "Hello, this is Sung-hwan. There seems to be a problem with the phone I bought. The thing is that I bought it three days ago, but the screen suddenly turned black. To deal with the problem, here are some suggestions I can come up with. First of all, could you exchange it for a new one? If not possible, how about fixing it for free? If not, I'll just return it and get a refund. If you have another idea, feel free to let me know. I want you to get back to me as soon as possible. Bye!"}, {"n": 13, "tag": "관련 경험 — 산 물건이 고장 남", "src": "응용", "q": "That's the end of the situation. Have you ever bought something that broke soon after you bought it? What happened, and how did you deal with it?", "a": "I had a similar experience in the past. Last year, I bought a new laptop online. But after a week, I had a problem because it didn't turn on. That made me completely disappointed, because I needed it for work. In order to deal with the problem, I called the service center. They told me to send it to them. Eventually, they gave me a new laptop after five days. From this experience, I learned to keep the receipt and the box for a while. Since then, I always keep them."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "자주 가는 병원 (WHERE)", "src": "응용", "q": "Tell me about a hospital or clinic you go to when you are sick. Where is it? What does it look like?", "a": "When I'm sick, I go to a small clinic near my house. It is on the second floor of a building next to the bus stop. When you come inside, you can see a reception desk on the right. There is a waiting area with some chairs and a TV. I usually write my name at the desk and wait for about twenty minutes. The doctor is so kind that he explains everything clearly. There is also a pharmacy on the first floor, so I can get my medicine easily. That's why I always go to that clinic."}, {"n": 15, "tag": "면접관에게 질문하기 — 병원", "src": "응용", "q": "I went to see a doctor last week. Please ask me three or four questions about my visit to the doctor.", "a": "Hello, you said that you went to see a doctor last week. I'd like to ask you a few questions about it. First, why did you go to see a doctor? Did you have a cold? Also, which hospital did you go to? Is it near your house? And how long did you wait there? Finally, are you feeling better now? These are all of my questions. Thank you for listening to them. I hope you get well soon, bye!"}]}]}, {"no": 7, "title": "모의고사 7회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. I go to the park near my house with my mother every evening. Also, I love listening to music, especially on the bus. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "우리나라의 공원 (WHERE)", "src": "응용", "q": "Tell me about the parks in your country. What do they look like? What can people do there?", "a": "In my country, there are many parks in the cities. Most apartments have a small park nearby. Big parks usually have a lake or a river. Around it, there are walking paths and bike roads. There are also playgrounds for children and exercise machines for older people. In the evening, many people go to parks to walk or jog. On weekends, families have a picnic on the grass. I think parks are very important places for people in my country."}, {"n": 3, "tag": "공원에 함께 가는 사람 (WHO)", "src": "응용", "q": "Who do you usually go to the park with? Tell me about that person and what you do together.", "a": "I usually go to the park with my mother. She is in her late fifties. She is so kind and active. Every evening after dinner, we walk around the lake together. It takes about an hour. While we are walking, we talk about our day. Sometimes, we buy some ice cream at the convenience store. Because I'm busy with work, I don't have much time with her. So, this walk is very special to me."}, {"n": 4, "tag": "그 공원에 처음 간 날 (처음 경험)", "src": "응용", "q": "Tell me about the first time you went to your favorite park. When was it? What was it like?", "a": "I first went to Lake park about five years ago. My family moved to Suwon at that time. On the first weekend, I went out to look around my new neighborhood. I found a big park just five minutes away from my house. When I went inside, I was surprised because there was a huge lake at the center. There were many people walking and jogging around it. The view was so beautiful that I sat on a bench for an hour. Since then, the park has been my favorite place."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "가장 좋아하는 노래 (WHICH)", "src": "응용", "q": "What is your favorite song? What kind of song is it? Why do you like it?", "a": "My favorite song is Spring Day by BTS. It's a slow and calm song. The melody is so beautiful that I can relax when I listen to it. The song is about missing a friend. When I listen to it, I think about my old friends. I listen to it on the bus every morning. Also, I sing it when I go to karaoke with my friends. For these reasons, it's my favorite song."}, {"n": 6, "tag": "음악을 듣는 때와 이유 (WHAT)", "src": "응용", "q": "When do you usually listen to music? Why do you listen to music at those times?", "a": "I listen to music many times a day. In the morning, I listen to music on the bus. It wakes me up and makes me feel good. At work, I listen to calm music when I need to focus. In the evening, I listen to fast songs while I'm jogging. They give me energy. Before I go to bed, I listen to slow songs to relax. I think music helps me in every part of my day."}, {"n": 7, "tag": "음악과 관련된 기억에 남는 일 (에피소드)", "src": "응용", "q": "Tell me about a memorable experience you had related to music. What happened?", "a": "Last month, I went to Hongdae with my friend on a Saturday night. There were many street musicians there. One of them was singing my favorite song. His voice was so beautiful that many people stopped to listen. We stood there and sang along with him. After the song, he asked for a song request. I shouted the name of another song, and he sang it for me. It was so exciting that I recorded a video. Since then, I sometimes watch the video and smile."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "자주 가는 커피숍 (WHERE)", "src": "응용", "q": "Tell me about a coffee shop you often go to. Where is it? What does it look like?", "a": "The coffee shop I often go to is near my office. It takes about three minutes on foot. When seen from the outside, it looks small and cozy. When you come inside, you can see a counter on the right. There are about ten tables and a big window. The coffee is so good and not expensive. My favorite part is the seat by the window. I can see the street and relax there. That makes me feel comfortable."}, {"n": 9, "tag": "커피숍에서 하는 일 (WHAT)", "src": "응용", "q": "What do you usually do at a coffee shop? Who do you go with?", "a": "I go to a coffee shop almost every day. In the morning, I buy an iced Americano on my way to work. During lunchtime, I sometimes go there with my coworkers. We talk about our weekends and relax. On weekends, I meet my friends at a coffee shop. Because we are so busy, it's a great chance to catch up with each other. Sometimes, I go there alone and read a book. I believe coffee shops are great places to enjoy my free time."}, {"n": 10, "tag": "커피숍에서 있었던 일 (에피소드)", "src": "응용", "q": "Tell me about something memorable that happened at a coffee shop. What happened?", "a": "A few weeks ago, something embarrassing happened at a coffee shop. I was carrying a hot coffee to my seat. Suddenly, a child ran in front of me, and I stopped quickly. My coffee spilled on a woman's white bag. I was so embarrassed that I didn't know what to do. I said sorry many times and offered to pay for the cleaning. But she smiled and said it was okay. She was so kind that I felt relieved. Since then, I always use a lid when I carry hot coffee."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "전화로 문의하기 — 친구와의 약속", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. Your friend wants to meet you at a coffee shop this weekend. Call your friend and ask three or four questions about the plan.", "a": "Hi, it's me, Sung-hwan. I got your message about this weekend, so I want to ask you a few questions. First of all, what time do you want to meet? Is Saturday afternoon okay? Also, which coffee shop should we go to? How about the one near my office? And who else is coming? Is it just the two of us? Lastly, what do you want to do after coffee? Let me know soon. Bye!"}, {"n": 12, "tag": "문제상황 — 친구와의 약속에 늦음", "src": "응용", "q": "I'm sorry, but there is a problem I need you to resolve. You are supposed to meet your friend at a coffee shop, but you will be very late. Call your friend, explain the situation, and give two or three alternatives.", "a": "Hi, it's me, Sung-hwan. I'm sorry, but there seems to be a problem. The thing is that I'm still at the office, because I have to finish some work. I'll be about an hour late. To deal with the problem, here are some suggestions I can come up with. First of all, could you wait for me at the coffee shop? I'll buy you dinner. If not possible, how about meeting near my office instead? If not, let's meet tomorrow evening. If you have another idea, feel free to let me know. I'm so sorry again. Bye!"}, {"n": 13, "tag": "관련 경험 — 약속에 늦은 일", "src": "응용", "q": "That's the end of the situation. Have you ever been late for an important appointment? What happened, and how did you deal with it?", "a": "I had a similar experience in the past. Last year, I had a job interview in Seoul. But I had a problem because my bus was stuck in heavy traffic. That made me completely panic. In order to deal with the problem, I got off the bus and took the subway. I also called the company and said I would be ten minutes late. Luckily, they understood. Eventually, I finished the interview well. From this experience, I learned to leave home early for important days. Since then, I've never made the same mistake."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "우리나라의 유명인 (WHO)", "src": "응용", "q": "Tell me about a famous person in your country. Who is that person? What is that person famous for?", "a": "I'd like to talk about Son Heung-min. He is a famous Korean soccer player. He played in England for many years. He is so fast and good at scoring goals. Also, he always smiles and looks friendly. Many people in my country love him, because he worked so hard to become a star. When he plays, my family watches the game together. I think he is a great role model for young people."}, {"n": 15, "tag": "면접관에게 질문하기 — 유명인", "src": "응용", "q": "I also have a celebrity I like. Please ask me three or four questions about the famous person I like.", "a": "Hello, you said that you also have a celebrity you like. I'd like to ask you a few questions about it. First, who is that person? Is it a singer or an actor? Also, why do you like that person? And when did you become a fan? Finally, have you ever seen that person in person? These are all of my questions. Thank you for listening to them. I hope you have a good day, bye!"}]}]}, {"no": 8, "title": "모의고사 8회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. I like to go to the beach in summer. Also, I go on trips in Korea with my close friends two or three times a year. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "우리나라의 해변 (WHERE)", "src": "응용", "q": "Tell me about the beaches in your country. Where are they? What do they look like?", "a": "Korea is surrounded by the sea on three sides, so there are many beaches. The most famous beaches are in Busan, Gangneung, and Jeju Island. The beaches on the east coast have clear blue water. The beaches on the west coast are famous for beautiful sunsets. In summer, the beaches are so crowded that it's hard to find a spot. Around the beaches, there are many hotels and seafood restaurants. I think Korean beaches are great places to relax."}, {"n": 3, "tag": "해변에 갈 때 챙기는 것 (WHICH)", "src": "응용", "q": "What do you bring with you when you go to the beach? Why do you bring those things?", "a": "When I go to the beach, I always bring a few things. First of all, I bring sunscreen, because the sun is so strong. In addition, I bring a hat and sunglasses. Then, I pack a mat, a towel, and a swimsuit. I also bring a lot of water to stay hydrated. Lastly, I bring a waterproof case for my phone. With these things, I can enjoy the beach without problems."}, {"n": 4, "tag": "처음 해변에 간 경험 (처음 경험)", "src": "응용", "q": "Tell me about the first time you went to the beach. When was it? Who were you with? How did you feel?", "a": "I first went to the beach when I was about seven years old. My family went to Gangneung for summer vacation. It took about four hours by car. When I saw the sea, I was so surprised because it was so big and blue. I played in the water with my brother all day. We also built a sandcastle. In the evening, we ate grilled clams near the beach. Since then, I've loved going to the beach."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "국내 여행에서 하는 일 (WHAT)", "src": "응용", "q": "Who do you usually travel with in Korea? What do you usually do during your trips?", "a": "I usually travel with my close friends. We go on a trip in Korea two or three times a year. We like to visit small cities by the sea. During the day, we visit famous places and take a lot of pictures. We also go to traditional markets to try local food. In the evening, we stay at a small guesthouse and talk until late. Because we are so busy, it's a great chance to catch up with each other. I believe traveling with friends is the best way to relieve stress."}, {"n": 6, "tag": "최근에 다녀온 국내 여행 (최근 경험)", "src": "그대로", "q": "Please tell me about your most recent trip in Korea. Where did you go? What did you do? Who did you go with?", "a": "During the recent holidays, I visited Jeju Island to celebrate my best friend's birthday. First, we went to a beach. It was so beautiful that there were many people. I spread out a mat in our spot and ordered in some food from a local restaurant. Also, there was a big traditional market nearby, so some of us went there to buy more food
