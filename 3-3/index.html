and drinks for our party. Since we were so busy, we couldn't hang out often. So, it was a great chance to catch up with one another. All of us had a lot of fun. Overall, it was a great time with old friends."}, {"n": 7, "tag": "여행 중 생긴 문제 (에피소드)", "src": "응용", "q": "Tell me about a time when something unexpected happened during a trip. What happened, and how did you deal with it?", "a": "Last year, I went on a trip to Busan with my friends. On the last day, we went shopping at a market near the station. We were having so much fun that we forgot about the time. When we got to the station, our KTX had just left. That made us completely panic. In order to deal with it, we went to the ticket counter. Luckily, there were some seats on the next train an hour later. We had to pay a little more money, but we could go home safely. Since then, I always check the time when I travel."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "자주 가는 식당 (WHERE)", "src": "응용", "q": "Tell me about a restaurant you often go to. Where is it? What does it look like?", "a": "The restaurant I often go to is a Korean barbecue place near my house. It takes about ten minutes on foot. When seen from the outside, it looks old, but it's always busy. When you come inside, you can see many tables with grills in the middle. The staff are so friendly that they help us cook the meat. The meat is so fresh and even cheap. My favorite part is the side dishes, because they are free. For these reasons, I like the restaurant the most."}, {"n": 9, "tag": "외식하는 습관 (WHAT)", "src": "응용", "q": "How often do you eat out? Who do you usually eat out with? What do you usually eat?", "a": "I eat out about twice a week. On weekdays, I have lunch with my coworkers near my office. We usually eat Korean food like kimchi stew. On weekends, I go out to eat with my family or friends. We like to try new restaurants. Before we go, I check the reviews online. Sometimes, we order in some food and eat at home. I believe eating out is a great way to enjoy my free time."}, {"n": 10, "tag": "기억에 남는 외식 (경험)", "src": "응용", "q": "Tell me about a memorable meal you had at a restaurant. When was it? Why was it memorable?", "a": "The most memorable meal was my parents' wedding anniversary dinner last year. My brother and I booked a nice Italian restaurant for them. The restaurant was on the top floor of a tall building, so the view was so beautiful. We ordered pasta, steak, and a cake. During the dinner, we gave them a letter and some flowers. My mother was so touched that she almost cried. After the dinner, we took a family picture. That's why the dinner is unforgettable to me."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "전화로 문의하기 — 식당 예약", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. You want to have dinner with your family at a new restaurant. Call the restaurant and ask three or four questions to make a reservation.", "a": "Hello, I'm calling to get some information about a reservation. I'm planning a dinner for my family this Saturday, so I want to ask you a few questions. First of all, do you have a table for five people at seven? Also, do you have a private room? My father doesn't like noisy places. And what is the most popular dish? Lastly, is there a parking lot? These are all of my questions. Thanks for your help."}, {"n": 12, "tag": "문제상황 — 주문과 다른 음식이 나옴", "src": "응용", "q": "I'm sorry, but there is a problem I need you to resolve. At the restaurant, the server brought you the wrong food. Explain the situation to the server and give two or three alternatives.", "a": "Excuse me, there seems to be a problem with my order. The thing is that I ordered a seafood pasta, but you brought me a cream pasta. To deal with the problem, here are some suggestions I can come up with. First of all, could you make my seafood pasta quickly? If not possible, how about giving me another dish? If not, I'll just cancel my order. If you have another idea, feel free to let me know. I want you to take care of it as soon as possible. Thank you."}, {"n": 13, "tag": "관련 경험 — 음식 주문 문제", "src": "응용", "q": "That's the end of the situation. Have you ever had a problem when you ordered food? What happened, and how did you deal with it?", "a": "I had a similar experience in the past. A few months ago, I ordered some chicken for my friends' party. But I had a problem because it didn't arrive for two hours. That made me completely upset, because everyone was hungry. In order to deal with the problem, I called the restaurant. They said sorry and sent the chicken with free drinks. Eventually, we could eat, but it was a little cold. From this experience, I learned to order food early for parties. Since then, I've never made the same mistake."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "자주 가는 쇼핑 장소 (WHERE)", "src": "응용", "q": "Tell me about a place where you often go shopping. Where is it? What does it look like?", "a": "I often go shopping at a big shopping mall near my house. It takes about ten minutes by bus. It is so big that there are more than two hundred stores. On the first floor, there are clothing stores and cosmetic shops. On the top floor, there are many restaurants and a movie theater. I usually go there with my friends on weekends. After shopping, we have dinner and watch a movie. I think it's the best place to spend my weekend."}, {"n": 15, "tag": "면접관에게 질문하기 — 쇼핑", "src": "응용", "q": "I also like to go shopping. Please ask me three or four questions about where I like to shop.", "a": "Hello, you said that you also like to go shopping. I'd like to ask you a few questions about it. First, where do you usually go shopping? Is it a mall or a market? Also, who do you go shopping with? And what do you usually buy? Finally, do you shop online, too? These are all of my questions. Thank you for listening to them. I hope you have a good day, bye!"}]}]}, {"no": 9, "title": "모의고사 9회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. I go jogging along a stream near my house. Also, I like to go to see musicals and plays with my family. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "조깅하는 장소 (WHERE)", "src": "응용", "q": "Tell me about the place where you usually go jogging. Where is it? What does it look like?", "a": "I usually go jogging along a stream near my house. It is just three minutes away on foot. There is a long path next to the water. On both sides, there are many trees and flowers. There are also some benches and exercise machines along the path. At night, the path is bright because there are many lights. The path is so popular that many people jog and walk there. That makes me feel safe. For these reasons, I like the place the most."}, {"n": 3, "tag": "조깅할 때 입는 옷과 물건 (WHICH)", "src": "응용", "q": "What do you wear when you go jogging? What items do you bring with you?", "a": "When I go jogging, I always wear comfortable clothes. In summer, I wear a T-shirt and shorts. In winter, I wear a sweatshirt and sweatpants. The most important thing is running shoes. I always wear running shoes that fit well, because I don't want to have blisters. I also bring my phone and wireless earphones to listen to music. Lastly, I carry a small bottle of water. With these things, I can enjoy jogging without problems."}, {"n": 4, "tag": "조깅 중 기억에 남는 일 (에피소드)", "src": "응용", "q": "Tell me about a memorable experience you had while jogging. What happened?", "a": "Last spring, I was jogging at the park after work. It was getting dark, so I couldn't see the path well. Suddenly, I stepped on a small rock and twisted my ankle. It hurt so much that I couldn't walk. At that time, a man who was jogging stopped and helped me. He helped me sit on a bench and called a taxi for me. The next day, I went to the hospital. Luckily, it wasn't serious. Since then, I always jog on bright paths."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "좋아하는 공연 배우 (WHO)", "src": "응용", "q": "Who is your favorite performer? What does that person look like? Why do you like that person?", "a": "My favorite musical actor is Cho Seung-woo. He is one of the most famous musical actors in Korea. He is in his forties, and he has a deep voice. When he sings on stage, everyone in the hall is quiet. His acting is so natural that I forget it's a show. I've seen him in three musicals so far. Tickets for his shows sell out so fast, so I have to book early. I think he is the best performer in my country."}, {"n": 6, "tag": "공연 표를 예매하는 방법 (HOW)", "src": "응용", "q": "How do you usually get tickets for a performance? Tell me about the process step by step.", "a": "I usually book tickets for shows online. First, I check the show schedule on a ticket website. Then, I wait for the ticket open day. Popular shows sell out in a few minutes, so I set an alarm. When the tickets open, I quickly choose my seats and pay with my credit card. Sometimes, my friend and I try together to get good seats. After I book, I get a message on my phone. I think booking tickets is a little stressful, but it's exciting."}, {"n": 7, "tag": "최근에 본 공연 (최근 경험)", "src": "응용", "q": "Tell me about the last performance you saw. What was it? Who did you go with? What did you do?", "a": "Last month, I went to see a play with my parents. It was their wedding anniversary, so I bought the tickets for them. The theater was in Daehangno, a famous street for plays in Seoul. The play was a comedy about a family. It was so funny that we laughed the whole time. After the play, we had dinner at a restaurant nearby. My parents said it was the best present. Overall, it was a great time with my family."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "우리나라의 지형 (WHERE)", "src": "응용", "q": "Tell me about the geography of your country. What does it look like? Are there many mountains, rivers, or beaches?", "a": "Korea is a small country, but it has many kinds of nature. About seventy percent of the country is mountains. So, many people enjoy hiking on weekends. Also, Korea is surrounded by the sea on three sides. There are many beautiful beaches and islands. There are big rivers, too, like the Han River in Seoul. Jeju Island is the biggest island, and it has a big mountain called Hallasan. I think Korea has beautiful nature."}, {"n": 9, "tag": "사람들이 자연에서 하는 활동 (WHAT)", "src": "응용", "q": "What do people in your country do outdoors? What activities are popular in each season?", "a": "In my country, people enjoy many outdoor activities. Because there are many mountains, hiking is very popular. On weekends, you can see many people in colorful hiking clothes. In summer, people go to the beach or the valley to swim. Along the Han River, people ride bikes and have picnics. In fall, many people go to the mountains to see the red and yellow leaves. In winter, some people go skiing. I think people in my country love nature."}, {"n": 10, "tag": "자연에서 한 기억에 남는 경험 (경험)", "src": "응용", "q": "Tell me about a memorable experience you had in nature, like on a mountain or by a river.", "a": "Two years ago, I climbed Hallasan on Jeju Island with my friends. We started early in the morning. The path was so long and steep that we were very tired. We stopped many times to rest and drink water. After about five hours, we finally got to the top. The view was so beautiful that we forgot we were tired. There was a lake at the top of the mountain. We took a lot of pictures there. It was the hardest but the best trip."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "전화로 문의하기 — 공연 예매", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. You want to see a musical with your friend. Call the ticket office and ask three or four questions about the tickets.", "a": "Hello, I'm calling to get some information about musical tickets. I'm planning to see a musical with my friend, so I want to ask you a few questions. First of all, are there any seats left for this Friday night? Also, how much are the tickets? Is there a group discount? And how long is the show? Is there a break in the middle? Lastly, can I cancel the tickets if something urgent comes up? These are all of my questions. Thanks for your help."}, {"n": 12, "tag": "문제상황 — 아파서 공연에 못 감", "src": "응용", "q": "I'm sorry, but there is a problem I need you to resolve. You were supposed to see a musical with your friend tonight, but you are sick. Call your friend, explain the situation, and give two or three alternatives.", "a": "Hi, it's me, Sung-hwan. I'm sorry, but there seems to be a problem. The thing is that I have a bad cold, so I can't go to the musical with you tonight. To deal with the problem, here are some suggestions I can come up with. First of all, how about going with your sister instead? I'll give you my ticket. If not possible, could you sell my ticket online? If not, let's change the tickets for next weekend. If you have another idea, feel free to let me know. I'm so sorry again. Bye!"}, {"n": 13, "tag": "관련 경험 — 아파서 계획을 취소한 일", "src": "응용", "q": "That's the end of the situation. Have you ever had to cancel your plans because you were sick? What happened, and how did you deal with it?", "a": "I had a similar experience in the past. Last year, I planned a trip to Gangneung with my friends. But the day before the trip, I had a problem because I got a high fever. That made me completely disappointed. In order to deal with the problem, I called my friends and told them about it. They said it was okay and went without me. I stayed home and took some medicine. Eventually, I got better in three days. From this experience, I learned to take care of my health before a big trip. Since then, I've never made the same mistake."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "인터넷으로 하는 일 (WHAT)", "src": "응용", "q": "What do you usually do on the Internet? How often do you use it?", "a": "I use the Internet every day. In the morning, I read the news on my phone. At work, I send emails and look for information. During lunchtime, I watch short videos on YouTube. In the evening, I shop online or check my bank account. On weekends, I watch movies on Netflix. I think I can't live without the Internet."}, {"n": 15, "tag": "면접관에게 질문하기 — 인터넷", "src": "응용", "q": "I also use the Internet a lot. Please ask me three or four questions about how I use the Internet.", "a": "Hello, you said that you also use the Internet a lot. I'd like to ask you a few questions about it. First, how many hours a day do you use the Internet? Also, what do you usually do online? Do you watch videos or read the news? And what is your favorite website? Finally, do you use the Internet more on your phone or on your computer? These are all of my questions. Thank you for listening to them. I hope you have a good day, bye!"}]}]}, {"no": 10, "title": "모의고사 10회", "groups": [{"label": "시작", "items": [{"n": 1, "tag": "자기소개", "src": "응용", "q": "Let's start the interview now. Tell me a little bit about yourself.", "a": "Hello, my name is Sung-hwan Kim. I'm in my early thirties. I'm not a student. I work for a small IT company in Seoul. I live with my family in an apartment in the city of Suwon. When I have free time, I try to do something fun. When I have a long vacation, I like to stay home and rest. But once a year, I travel abroad with my friends. They help me relieve stress. I believe these are great ways to enjoy my free time. Okay, that's all about me. Thank you."}]}, {"label": "선택주제 1", "items": [{"n": 2, "tag": "집에서 휴가를 보내는 이유 (WHY)", "src": "응용", "q": "You indicated that you like to stay home for vacation. Why do you like to spend your vacation at home?", "a": "I like to stay home during my vacation for a few reasons. First of all, I can rest well. Because I'm busy with work, I feel so tired all the time. At home, I can sleep as much as I want. In addition, it doesn't cost much money. Traveling is fun, but it's expensive. Lastly, I can spend time with my family. We cook together and watch movies. For these reasons, I like to stay home for vacation."}, {"n": 3, "tag": "휴가 첫날에 하는 일 (WHAT)", "src": "응용", "q": "What do you usually do on the first day of your vacation? Tell me about it in detail.", "a": "On the first day of my vacation, I always do the same things. First, I turn off my alarm and sleep until noon. Then, I have a late brunch with a cup of coffee. In the afternoon, I clean my room and do the laundry. I want to start my vacation in a clean room. In the evening, I order in some food and watch a musical movie. They are so energetic and entertaining that I can relieve stress. I believe this is a great way to start my vacation."}, {"n": 4, "tag": "집 휴가 중 기억에 남는 일 (에피소드)", "src": "그대로", "q": "Can you tell me one memorable experience you had during a vacation at home? What happened? Why was it unforgettable?", "a": "Something unexpected happened during my vacation at home. One afternoon, I went to a coffee shop near my house with my friend. Usually, it was quiet, so we wanted to catch up with each other. However, at that time, I found a lot of people looking at something. As I came close to them, I could see a famous actor filming there. Even though he was wearing a sweatshirt, he looked so fabulous. It was my first time to see a celebrity in person. Luckily, I could take a picture with him. That's why that vacation is the one I remember the most."}]}, {"label": "선택주제 2", "items": [{"n": 5, "tag": "좋았던 여행지 (WHERE)", "src": "응용", "q": "Tell me about a foreign city you have visited. Where is it? What does it look like? Why do you like it?", "a": "I'd like to talk about Da Nang in Vietnam. There are many reasons why I like it. First of all, it is not far from Korea. It takes about four and a half hours by plane. Also, it has a beautiful beach, so I can relax and enjoy the beauty of nature. Plus, there is a big traditional market in the city. It's famous for fresh local food. It's so delicious and even cheap. For these reasons, I like Da Nang the most."}, {"n": 6, "tag": "해외여행 가서 하는 일 (WHAT)", "src": "응용", "q": "What do you usually do when you travel abroad? Tell me about a typical day during your trip.", "a": "When I travel abroad, I try to do many things. In the morning, I visit famous places and take a lot of pictures. For lunch, I always try the local food. I think food is the best part of traveling. In the afternoon, I walk around the city and look around the shops. I like to buy small gifts for my family. In the evening, I go to a night market. I believe these are great ways to enjoy my trip."}, {"n": 7, "tag": "처음 간 해외여행 (처음 경험)", "src": "응용", "q": "Tell me about your first trip abroad. Where did you go? Who did you go with? How did you feel?", "a": "My first trip abroad was to Japan when I was in college. I went with two friends during summer vacation. I was so excited that I couldn't sleep the night before. When we arrived in Osaka, everything was new to me. The streets were so clean and the people were so kind. We ate sushi and ramen every day. We also went to a big theme park. Since then, I've traveled abroad once a year."}]}, {"label": "돌발주제 1", "items": [{"n": 8, "tag": "좋아하는 음식 (WHICH)", "src": "응용", "q": "What is your favorite food? What is it made of? Why do you like it?", "a": "My favorite food is kimchi stew. It's a traditional Korean food. It's made with kimchi, pork, tofu, and green onions. It's a little spicy, but it's so delicious. I usually eat it with a bowl of rice. My mother makes the best kimchi stew. When I come home tired, she makes it for me. It makes me feel warm and happy. For these reasons, it's my favorite food."}, {"n": 9, "tag": "내가 요리하는 방법 (HOW)", "src": "응용", "q": "Tell me about a dish you can cook. How do you make it? Tell me step by step.", "a": "I often cook kimchi fried rice for my family. It's easy to make. First, I cut some kimchi, ham, and green onions into small pieces. Then, I fry them in a pan with some oil. Next, I add a bowl of rice and mix everything well. After that, I put a fried egg on top. It takes only about twenty minutes. My family loves it, so I'm happy to cook it."}, {"n": 10, "tag": "요리하다 생긴 일 (에피소드)", "src": "응용", "q": "Tell me about a memorable experience you had while cooking. What happened?", "a": "Last month, I tried to make a cake for my mother's birthday. It was my first time to bake a cake. I watched a video on YouTube and followed the steps. But I put too much sugar in it by mistake. Also, I left it in the oven too long, so the top was burned. That made me completely disappointed. So, I covered the cake with a lot of cream and fruit. Luckily, my mother loved it anyway. Since then, I always check the recipe twice."}]}, {"label": "롤플레이", "items": [{"n": 11, "tag": "전화로 문의하기 — 여행 패키지", "src": "응용", "q": "I'd like to give you a situation and ask you to act it out. You want to go on a trip abroad with your family. Call a travel agency and ask three or four questions about a travel package.", "a": "Hello, I'm calling to get some information about a travel package. I'm planning a trip abroad with my family, so I want to ask you a few questions. First of all, what packages do you have for next month? We are interested in Southeast Asia. Also, how much is it per person? Are the flight and the hotel included? And how long is the trip? Lastly, can I get a full refund if I cancel it? These are all of my questions. Thanks for your help."}, {"n": 12, "tag": "문제상황 — 여권 만료", "src": "응용", "q": "I'm sorry, but there is a problem I need you to resolve. A few days before the trip, you find out that your passport has expired. Call the travel agency, explain the situation, and give two or three alternatives.", "a": "Hello, this is Sung-hwan. I'm sorry, but there seems to be a problem with my trip. The thing is that I just found out my passport has expired. I can't get a new one before the trip. To deal with the problem, here are some suggestions I can come up with. First of all, could you change my trip to next month? If not possible, how about letting my brother go instead of me? If not, I'll just cancel my part and pay the cancellation fee. If you have another idea, feel free to let me know. I'm so sorry again. Bye!"}, {"n": 13, "tag": "관련 경험 — 여행 중 물건을 두고 내림", "src": "응용", "q": "That's the end of the situation. Have you ever had a problem while you were on a trip? What happened, and how did you deal with it?", "a": "I had a similar experience in the past. A few years ago, I went on a business trip to Busan. I took a taxi from the station to my hotel. When I got out, I left my bag in the taxi. I didn't notice until I was at the front desk. That made me completely panic. In order to deal with the problem, I checked the receipt and called the taxi company. Luckily, the driver brought my bag back to the hotel. From this experience, I learned to check the back seat before I get out. Since then, I've never made the same mistake."}]}, {"label": "돌발주제 2", "items": [{"n": 14, "tag": "우리나라의 축제 (WHAT)", "src": "응용", "q": "Tell me about a festival in your country. What is the festival about? What do people do there?", "a": "I'd like to talk about the Jinhae Cherry Blossom Festival. It is held every spring in the city of Changwon. During the festival, the whole city is covered with pink cherry blossoms. Many people come to walk under the trees and take pictures. There are also street food stalls and music shows. At night, the trees are lit up, so it's so beautiful. I went there with my family two years ago. It was so crowded, but we had a great time."}, {"n": 15, "tag": "면접관에게 질문하기 — 축제", "src": "응용", "q": "I also enjoy going to festivals. Please ask me three or four questions about the festivals I have been to.", "a": "Hello, you said that you also enjoy going to festivals. I'd like to ask you a few questions about it. First, what festival did you go to last? Where was it? Also, who did you go with? And what did you do there? Did you try any food? Finally, which festival do you want to go to next? These are all of my questions. Thank you for listening to them. I hope you have a good day, bye!"}]}]}];

const ICON_SPEAK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 2v2a8 8 0 010 16v2a10 10 0 000-20z"/></svg>';
const ICON_STOP  = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const ICON_CHEV  = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';

function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }

let currentTest = Math.min(parseInt(store('opic33-test') || '0', 10) || 0, DATA.length - 1);
let speakingBtn = null;
let voices = [];
let chosenVoice = null;
let rate = parseFloat(store('opic-rate') || '0.8') || 0.8;
const hasSpeech = 'speechSynthesis' in window;

/* ---------- 목소리 ---------- */
function pickBest(list){
  const saved = store('opic-voice');
  if (saved){ const v = list.find(v => v.name === saved); if (v) return v; }
  const order = [
    v => v.name === 'Google US English',
    v => v.name.includes('Google') && v.lang === 'en-US',
    v => v.name.includes('Samantha'),
    v => v.lang === 'en-US',
  ];
  for (const test of order){ const v = list.find(test); if (v) return v; }
  return list[0] || null;
}
function loadVoices(){
  const sel = document.getElementById('voice');
  if (!hasSpeech){ sel.innerHTML = '<option>음성 미지원 브라우저</option>'; return; }
  voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  if (!voices.length){ sel.innerHTML = '<option>기본 음성</option>'; return; }
  chosenVoice = pickBest(voices);
  sel.innerHTML = voices.map(v =>
    `<option value="${v.name}"${v === chosenVoice ? ' selected' : ''}>${v.name}</option>`
  ).join('');
}
if (hasSpeech){ speechSynthesis.onvoiceschanged = loadVoices; }
loadVoices();

const rateSel = document.getElementById('rate');
rateSel.value = String(rate);
if (rateSel.value !== String(rate)) { rate = 0.8; rateSel.value = '0.8'; }
rateSel.addEventListener('change', e => { rate = parseFloat(e.target.value); store('opic-rate', e.target.value); stopSpeech(); });

document.getElementById('voice').addEventListener('change', e => {
  chosenVoice = voices.find(v => v.name === e.target.value) || null;
  store('opic-voice', e.target.value);
  stopSpeech();
});

/* ---------- 읽어주기 ---------- */
function stopSpeech(){
  if (hasSpeech) speechSynthesis.cancel();
  if (speakingBtn){
    speakingBtn.classList.remove('on');
    speakingBtn.innerHTML = ICON_SPEAK;
    speakingBtn.setAttribute('aria-label', speakingBtn.dataset.label);
    speakingBtn = null;
  }
}
function speak(text, btn){
  if (!hasSpeech) return;
  if (speakingBtn === btn){ stopSpeech(); return; }
  stopSpeech();
  const u = new SpeechSynthesisUtterance(text);
  if (chosenVoice) u.voice = chosenVoice;
  u.lang = chosenVoice ? chosenVoice.lang : 'en-US';
  u.rate = rate;
  u.onend = u.onerror = () => { if (speakingBtn === btn) stopSpeech(); };
  speakingBtn = btn;
  btn.classList.add('on');
  btn.innerHTML = ICON_STOP;
  btn.setAttribute('aria-label', '읽기 멈추기');
  speechSynthesis.speak(u);
}

/* ---------- 녹음 ---------- */
let recorder = null, recBtn = null, chunks = [];
async function toggleRecord(btn, slot){
  if (recorder && recBtn === btn){ recorder.stop(); return; }
  if (recorder){ recorder.stop(); }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recBtn = btn;
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const type = (chunks[0] && chunks[0].type) || 'audio/webm';
      const url = URL.createObjectURL(new Blob(chunks, { type: type }));
      slot.innerHTML = '';
      const audio = document.createElement('audio');
      audio.controls = true; audio.src = url;
      slot.appendChild(audio);
      btn.classList.remove('active');
      btn.querySelector('.txt').textContent = '다시 녹음';
      recorder = null; recBtn = null;
    };
    recorder.start();
    btn.classList.add('active');
    btn.querySelector('.txt').textContent = '녹음 멈추기';
  } catch (err){
    slot.innerHTML = '<p class="note">마이크를 쓸 수 없습니다. 파일을 직접 열었다면 브라우저가 마이크를 막습니다. GitHub Pages 주소로 접속하면 정상 동작합니다.</p>';
  }
}

/* ---------- 화면 그리기 ---------- */
function render(){
  const t = DATA[currentTest];
  const list = document.getElementById('list');
  list.innerHTML = '';

  t.groups.forEach(g => {
    const sec = document.createElement('section');
    sec.className = 'group';
    const lab = document.createElement('p');
    lab.className = 'group-label';
    lab.textContent = g.label;
    sec.appendChild(lab);

    g.items.forEach(it => {
      const card = document.createElement('article');
      card.className = 'card';

      const row = document.createElement('div');
      row.className = 'row';

      const num = document.createElement('span');
      num.className = 'num'; num.textContent = 'Q' + it.n;

      const topic = document.createElement('span');
      topic.className = 'topic'; topic.textContent = '질문 ' + it.n;

      const sw = document.createElement('span');
      sw.className = 'speak-wrap';
      const sb = document.createElement('button');
      sb.className = 'speak'; sb.innerHTML = ICON_SPEAK;
      sb.dataset.label = 'Q' + it.n + ' 질문 듣기';
      sb.setAttribute('aria-label', sb.dataset.label);
      sb.addEventListener('click', e => { e.stopPropagation(); speak(it.q, sb); });
      sw.appendChild(sb);

      const tg = document.createElement('button');
      tg.className = 'toggle'; tg.innerHTML = ICON_CHEV;
      tg.setAttribute('aria-expanded', 'false');
      tg.setAttribute('aria-label', '질문과 답변 펼치기');

      row.append(num, topic, sw, tg);

      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.innerHTML =
        '<p class="qlabel"></p>' +
        '<p class="en"></p>' +
        '<div class="tagline"><span>모범답안</span>' +
        '<span class="badge ' + (it.src === '그대로' ? 'keep' : 'adapt') + '">' + it.src + '</span></div>' +
        '<p class="ans"></p>';
      panel.querySelector('.qlabel').textContent = '질문 · ' + it.tag;
      panel.querySelector('.en').textContent = it.q;
      panel.querySelector('.ans').textContent = it.a;

      const tools = document.createElement('div');
      tools.className = 'tools';
      const ansBtn = document.createElement('button');
      ansBtn.className = 'btn';
      ansBtn.innerHTML = '<span class="txt">답변 듣기</span>';
      ansBtn.addEventListener('click', () => speak(it.a, sb));

      const slot = document.createElement('div');
      slot.style.width = '100%';

      const rb = document.createElement('button');
      rb.className = 'btn rec';
      rb.innerHTML = '<span class="dot"></span><span class="txt">내 답변 녹음</span>';
      rb.addEventListener('click', () => toggleRecord(rb, slot));

      tools.append(ansBtn, rb);
      panel.append(tools, slot);

      tg.addEventListener('click', () => {
        const open = card.classList.toggle('open');
        tg.setAttribute('aria-expanded', open ? 'true' : 'false');
        tg.setAttribute('aria-label', open ? '접기' : '질문과 답변 펼치기');
      });

      card.append(row, panel);
      sec.appendChild(card);
    });

    list.appendChild(sec);
  });

  document.getElementById('foot').textContent =
    t.title + ' · 자가진단 3-3 · 15문항 · 문항당 약 2분';
}

/* ---------- 탭 ---------- */
const tabs = document.getElementById('tabs');
DATA.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'tab'; b.textContent = t.no + '회';
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-selected', i === currentTest ? 'true' : 'false');
  b.addEventListener('click', () => {
    stopSpeech();
    currentTest = i;
    store('opic33-test', String(i));
    [...tabs.children].forEach((c, j) => c.setAttribute('aria-selected', j === i ? 'true' : 'false'));
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  tabs.appendChild(b);
});

render();
window.addEventListener('beforeunload', stopSpeech);
</script>
</body>
</html>
